<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DRIFT/LINE</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Inter',sans-serif;color:#fff;width:100vw;height:100vh}
#c{display:block;position:absolute;top:0;left:0;width:100%;height:100%}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
.scr{position:absolute;top:0;left:0;width:100%;height:100%;display:none;pointer-events:all;flex-direction:column;align-items:center;justify-content:center}
.scr.on{display:flex}
/* MENU */
#sm{background:linear-gradient(160deg,rgba(0,0,0,.75) 0%,rgba(5,10,20,.9) 100%)}
.logo{font-family:'Rajdhani',sans-serif;font-size:clamp(64px,9vw,108px);font-weight:700;letter-spacing:-1px;line-height:1}
.logo b{color:#e8f4ff}.logo span{color:#4db8ff}.logo i{color:#e8f4ff;font-style:normal}
.sub{font-family:'Rajdhani',sans-serif;font-size:13px;letter-spacing:8px;color:rgba(255,255,255,.35);margin-top:2px}
.btn{font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:600;letter-spacing:4px;padding:14px 52px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);color:rgba(255,255,255,.85);cursor:pointer;transition:all .16s;text-transform:uppercase;position:relative;overflow:hidden;backdrop-filter:blur(6px)}
.btn::before{content:'';position:absolute;left:0;top:0;width:3px;height:100%;background:#4db8ff;transform:scaleY(0);transition:transform .16s}
.btn:hover{border-color:#4db8ff;color:#4db8ff;padding-left:64px}
.btn:hover::before{transform:scaleY(1)}
.btn.p{border-color:#4db8ff;background:rgba(77,184,255,.1);color:#4db8ff}
.btn.p::before{transform:scaleY(1)}
.cdisp{position:absolute;top:20px;right:24px;display:flex;align-items:center;gap:7px;font-family:'Rajdhani',sans-serif;font-size:21px;font-weight:700}
.coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe066,#c87800);box-shadow:0 0 8px #ffcc0066}
/* MAP */
#smap{background:rgba(0,0,0,.84);gap:32px}
.mc{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.mcard{width:270px;border:1px solid rgba(255,255,255,.1);background:rgba(8,12,24,.9);cursor:pointer;transition:all .2s;overflow:hidden}
.mcard:hover,.mcard.s{border-color:#4db8ff;transform:translateY(-5px);box-shadow:0 16px 48px rgba(77,184,255,.15)}
.mi{width:100%;height:148px;position:relative}
.mn{font-family:'Rajdhani',sans-serif;font-size:17px;font-weight:700;padding:12px 14px 2px}
.mv{font-size:11px;color:rgba(255,255,255,.45);padding:0 14px 4px}
.mb{font-size:12px;color:#ffd700;padding:0 14px 12px}
/* GARAGE */
#sgar{background:rgba(0,0,0,.9);overflow-y:auto;padding:20px}
.gw{display:flex;gap:28px;width:100%;max-width:1080px;margin-top:10px}
.gl{width:320px;flex-shrink:0;display:flex;flex-direction:column;gap:14px}
.gprev{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.07);padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
#gc{background:#04060e;border:1px solid rgba(255,255,255,.05)}
.sr{display:flex;align-items:center;gap:8px;width:100%}
.sl{width:90px;font-family:'Rajdhani',sans-serif;font-size:12px;color:rgba(255,255,255,.5);letter-spacing:1px}
.sb{flex:1;height:4px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.sf{height:100%;border-radius:2px;background:linear-gradient(90deg,#4db8ff,#7c3aed);transition:width .5s}
.cp{display:flex;gap:6px;margin-top:2px}
.cs{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .18s}
.cs:hover,.cs.on{border-color:#fff;transform:scale(1.25)}
.cgr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cc{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02);padding:8px;cursor:pointer;transition:all .16s;display:flex;flex-direction:column;align-items:center;gap:5px;font-family:'Rajdhani',sans-serif;font-size:11px}
.cc:hover{border-color:rgba(255,255,255,.3)}.cc.on{border-color:#4db8ff;background:rgba(77,184,255,.07)}
.cc.lk{opacity:.5}
/* HUD */
#hud{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;display:none}
#hud.on{display:block}
/* Speed — bottom center like real games */
#spd-wrap{position:absolute;bottom:28px;right:48px;text-align:right}
#spd-num{font-family:'Rajdhani',sans-serif;font-size:72px;font-weight:700;line-height:1;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.8)}
#spd-unit{font-family:'Rajdhani',sans-serif;font-size:14px;letter-spacing:4px;color:rgba(255,255,255,.4)}
#spd-rpm{width:200px;height:3px;background:rgba(255,255,255,.1);margin-top:6px;border-radius:2px;overflow:hidden;margin-left:auto}
#spd-rpmf{height:100%;background:linear-gradient(90deg,#4db8ff,#ff4444);border-radius:2px;transition:width .06s}
#gear-disp{position:absolute;bottom:28px;right:265px;font-family:'Rajdhani',sans-serif;font-size:42px;font-weight:700;color:rgba(255,255,255,.35);text-shadow:0 2px 10px rgba(0,0,0,.6)}
/* Drift score — cinematic style */
#drift-live{position:absolute;bottom:50%;left:50%;transform:translate(-50%,50%);font-family:'Rajdhani',sans-serif;font-size:36px;font-weight:700;display:none;text-align:center;pointer-events:none}
#drift-pts{display:block;color:#fff;text-shadow:0 0 30px #4db8ff,0 2px 8px rgba(0,0,0,.8);letter-spacing:2px}
#drift-mult{display:block;font-size:16px;color:#4db8ff;letter-spacing:4px;margin-top:2px}
#combo-disp{position:absolute;top:50%;right:40px;transform:translateY(-50%);font-family:'Rajdhani',sans-serif;font-size:76px;font-weight:700;color:#4db8ff;text-shadow:0 0 30px #4db8ff88;display:none}
#session-score{position:absolute;top:20px;right:20px;text-align:right}
#session-score .lbl{font-family:'Rajdhani',sans-serif;font-size:11px;letter-spacing:3px;color:rgba(255,255,255,.35)}
#session-score .val{font-family:'Rajdhani',sans-serif;font-size:32px;font-weight:700;line-height:1.1;text-shadow:0 2px 12px rgba(0,0,0,.7)}
#best-drift{font-family:'Rajdhani',sans-serif;font-size:14px;color:#ffd700;text-align:right;margin-top:2px}
#hud-map{position:absolute;top:20px;left:20px;font-family:'Rajdhani',sans-serif;font-size:13px;letter-spacing:3px;color:rgba(255,255,255,.4)}
#spin-msg{position:absolute;top:36%;left:50%;transform:translate(-50%,-50%);font-family:'Rajdhani',sans-serif;font-size:68px;font-weight:700;color:#ff3333;text-shadow:0 0 40px #ff3333aa,0 0 80px #ff333344;display:none;letter-spacing:6px;pointer-events:none}
#near-msg{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);font-family:'Rajdhani',sans-serif;font-size:22px;color:#ffaa00;text-shadow:0 0 20px #ffaa00;display:none;letter-spacing:3px;pointer-events:none}
#coins-hud{position:absolute;top:62px;right:20px;font-family:'Rajdhani',sans-serif;font-size:13px;color:rgba(255,215,0,.7);text-align:right}
canvas#mm{position:absolute;bottom:28px;left:20px;border:1px solid rgba(255,255,255,.12);box-shadow:0 4px 20px rgba(0,0,0,.5)}
#mute-btn{position:absolute;top:20px;right:50%;transform:translateX(50%);font-size:18px;cursor:pointer;pointer-events:all;opacity:.5;background:rgba(0,0,0,.4);border:none;color:#fff;padding:4px 10px;border-radius:4px}
#mute-btn:hover{opacity:1}
/* PAUSE */
#spause{background:rgba(0,0,0,.55);backdrop-filter:blur(12px)}
/* END */
#send{background:rgba(0,0,0,.9);gap:12px}
.etitle{font-family:'Rajdhani',sans-serif;font-size:50px;font-weight:700;letter-spacing:4px}
.egrid{display:grid;grid-template-columns:1fr 1fr;gap:9px 48px;font-size:14px}
.ev{font-family:'Rajdhani',sans-serif;font-size:26px;font-weight:700;color:#4db8ff}
.rtg{font-family:'Rajdhani',sans-serif;font-size:88px;font-weight:700;line-height:1}
.rflv{font-size:13px;color:rgba(255,255,255,.45);font-style:italic;margin-top:3px}
.best-bnr{font-family:'Rajdhani',sans-serif;font-size:26px;color:#ffd700;text-shadow:0 0 20px #ffd70088;animation:pls .5s infinite alternate;display:none}
@keyframes pls{from{opacity:1}to{opacity:.5}}
.end-btns{display:flex;gap:10px;margin-top:12px}
.shdr{font-family:'Rajdhani',sans-serif;font-size:42px;font-weight:700;letter-spacing:4px}
/* NOTIF */
#notif{position:absolute;top:130px;left:50%;transform:translateX(-50%);font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:600;pointer-events:none;opacity:0;transition:opacity .25s;color:#4db8ff;letter-spacing:2px;text-align:center;text-shadow:0 0 20px currentColor}
/* Vignette overlay */
#vig{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 50%,rgba(0,0,0,.5) 100%);z-index:5}
/* Flash */
#flash{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;opacity:0;z-index:15;background:#fff}
/* Records */
#srec{background:rgba(0,0,0,.88);gap:20px}
.rtbl{width:520px;border-collapse:collapse}
.rtbl th{font-family:Rajdhani;letter-spacing:2px;font-size:12px;padding:8px 14px;border-bottom:1px solid rgba(255,255,255,.12);text-align:left;color:rgba(255,255,255,.4)}
.rtbl td{padding:10px 14px;font-family:Rajdhani;font-size:16px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="flash"></div>
<div id="ui">

<!-- MENU -->
<div id="sm" class="scr on">
  <div class="cdisp"><div class="coin"></div><span id="menu-c">0</span></div>
  <div class="logo"><b>DRIFT</b><span>/</span><i>LINE</i></div>
  <div class="sub">MASTERS EDITION</div>
  <div style="display:flex;flex-direction:column;gap:9px;margin-top:36px">
    <button class="btn p" onclick="UI.goMap()">DRIVE</button>
    <button class="btn" onclick="UI.goGar()">GARAGE</button>
    <button class="btn" onclick="UI.goRec()">RECORDS</button>
  </div>
</div>

<!-- MAP SELECT -->
<div id="smap" class="scr">
  <div class="shdr">SELECT TRACK</div>
  <div class="mc" id="mcards"></div>
  <div style="display:flex;gap:10px">
    <button class="btn" onclick="UI.goMenu()">BACK</button>
    <button class="btn p" onclick="UI.startGame()">RACE</button>
  </div>
</div>

<!-- GARAGE -->
<div id="sgar" class="scr">
  <div class="cdisp" style="position:relative;align-self:flex-end;margin-bottom:0"><div class="coin"></div><span id="gar-c">0</span></div>
  <div class="shdr">GARAGE</div>
  <div class="gw">
    <div class="gl">
      <div class="gprev">
        <canvas id="gc" width="292" height="186"></canvas>
        <div style="font-family:'Rajdhani',sans-serif;font-size:19px;font-weight:700" id="gcname">—</div>
        <div style="font-size:11px;color:rgba(255,255,255,.38);text-align:center" id="gcdesc">—</div>
        <div class="cp" id="gcp"></div>
        <div id="gstats" style="width:100%;display:flex;flex-direction:column;gap:6px;margin-top:2px"></div>
        <div style="display:flex;gap:7px;margin-top:8px">
          <button class="btn p" id="gsel" onclick="UI.selCar()" style="padding:10px 24px;font-size:15px">SELECT</button>
          <button class="btn" id="gbuy" onclick="UI.buyCar()" style="display:none;padding:10px 24px;font-size:15px">BUY</button>
        </div>
      </div>
    </div>
    <div style="flex:1">
      <div class="cgr" id="cgr"></div>
    </div>
  </div>
  <button class="btn" onclick="UI.goMenu()" style="margin-top:14px">BACK</button>
</div>

<!-- RECORDS -->
<div id="srec" class="scr">
  <div class="shdr">RECORDS</div>
  <table class="rtbl">
    <tr><th>TRACK</th><th>SCORE</th><th>BEST DRIFT</th><th>COMBO</th></tr>
    <tr><td>Harbor Night</td><td id="r0s">0</td><td id="r0d">0</td><td id="r0c">0x</td></tr>
    <tr><td>Canyon Dawn</td><td id="r1s">0</td><td id="r1d">0</td><td id="r1c">0x</td></tr>
    <tr><td>Neon Circuit</td><td id="r2s">0</td><td id="r2d">0</td><td id="r2c">0x</td></tr>
  </table>
  <button class="btn" onclick="UI.goMenu()">BACK</button>
</div>

<!-- PAUSE -->
<div id="spause" class="scr">
  <div style="font-family:'Rajdhani',sans-serif;font-size:54px;font-weight:700;letter-spacing:5px;margin-bottom:24px">PAUSED</div>
  <div style="display:flex;flex-direction:column;gap:9px">
    <button class="btn p" onclick="UI.resume()">RESUME</button>
    <button class="btn" id="vbtn" onclick="Snd.toggle()">SOUND: ON</button>
    <button class="btn" onclick="UI.endSess()">QUIT SESSION</button>
    <button class="btn" onclick="UI.goMenu()">MAIN MENU</button>
  </div>
</div>

<!-- END -->
<div id="send" class="scr">
  <div class="etitle">SESSION COMPLETE</div>
  <div class="best-bnr" id="ebnr">★ NEW PERSONAL BEST ★</div>
  <div style="display:flex;gap:56px;align-items:flex-start">
    <div class="egrid" id="egrid"></div>
    <div style="text-align:center">
      <div style="font-size:10px;letter-spacing:3px;color:rgba(255,255,255,.35)">STYLE</div>
      <div class="rtg" id="ertg">B</div>
      <div class="rflv" id="erflv">Not bad.</div>
    </div>
  </div>
  <div style="font-family:'Rajdhani',sans-serif;font-size:20px;display:flex;align-items:center;gap:8px">
    <div class="coin" style="width:22px;height:22px"></div>+<span id="ecoins">0</span> COINS
  </div>
  <div class="end-btns">
    <button class="btn p" onclick="UI.tryAgain()">TRY AGAIN</button>
    <button class="btn" onclick="UI.goGar()">GARAGE</button>
    <button class="btn" onclick="UI.goMenu()">MENU</button>
  </div>
</div>

<!-- HUD -->
<div id="hud">
  <div id="hud-map"></div>
  <div id="session-score">
    <div class="lbl">SESSION</div>
    <div class="val" id="hsc">0</div>
    <div id="best-drift">BEST: <span id="hbd">0</span></div>
  </div>
  <div id="coins-hud">🪙 <span id="hcc">0</span></div>
  <div id="combo-disp"></div>
  <div id="drift-live"><span id="drift-pts">0</span><span id="drift-mult">×1.0</span></div>
  <div id="spin-msg">SPIN OUT!</div>
  <div id="near-msg">NEAR MISS +0.5×</div>
  <div id="spd-wrap">
    <div id="spd-unit">KM/H</div>
    <div id="spd-num">0</div>
    <div id="spd-rpm"><div id="spd-rpmf"></div></div>
  </div>
  <div id="gear-disp">1</div>
  <canvas id="mm" width="170" height="170"></canvas>
  <button id="mute-btn" onclick="Snd.toggle()">🔊</button>
</div>

<div id="notif"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════
const CARS=[
  {id:0,name:'Civic Wreck',price:0,topSpd:24,acc:.52,brk:.85,steer:.045,gF:.90,gR:.58,hb:.62,mass:1200,tone:110,trail:'#aaaaaa',glow:false,desc:'Understeer-heavy. Learn here.'},
  {id:1,name:'Sunset 240',price:800,topSpd:32,acc:.70,brk:.82,steer:.054,gF:.86,gR:.50,hb:.70,mass:1040,tone:148,trail:'#bbddff',glow:false,desc:'Balanced. This is where it clicks.'},
  {id:2,name:'Ghost RS',price:2500,topSpd:38,acc:.86,brk:.80,steer:.060,gF:.84,gR:.44,hb:.78,mass:980,tone:188,trail:'#ffffff',glow:false,desc:'Snappy entry. Rewards precision.'},
  {id:3,name:'Ryū GT',price:6000,topSpd:46,acc:.96,brk:.76,steer:.056,gF:.82,gR:.38,hb:.84,mass:1060,tone:96,trail:'#ffdd44',glow:false,desc:'Fast and loose. Commit or spin.'},
  {id:4,name:'Phantom S',price:15000,topSpd:56,acc:1.12,brk:.72,steer:.066,gF:.80,gR:.33,hb:.88,mass:955,tone:225,trail:'#44aaff',glow:false,desc:'Explosive. Every input critical.'},
  {id:5,name:'VOID-R',price:40000,topSpd:66,acc:1.38,brk:.68,steer:.074,gF:.78,gR:.27,hb:.94,mass:900,tone:62,trail:'#aa44ff',glow:true,desc:'Godlike. Infinite potential.'}
];
const CCOLORS=[
  ['#e0e0e0','#b0b0b0'],['#cc2222','#991111'],['#1a6bb5','#0d4a80'],
  ['#121212','#0a0a0a'],['#e0a020','#b07010'],['#22aa44','#158830']
];
const MAPS=[
  {id:0,name:'HARBOR NIGHT',sky:0x060c1a,fog:0x050a14,fogD:.016,gnd:0x0a0f1a,road:0x0f1520,wall:0x1a3050,amb:0x102030,sun:0x3060a0,sunPos:[200,300,100],tree:0x0a2010,vibe:'Rainy port · 2AM · Neon reflections',accent:'#00cfff'},
  {id:1,name:'CANYON DAWN',sky:0x2a0e00,fog:0x1a0800,fogD:.012,gnd:0x3d1a00,road:0x7a7060,wall:0x8b3a0a,amb:0x441808,sun:0xff7700,sunPos:[400,200,300],tree:0x1a3010,vibe:'Desert canyon · Sunrise · Dust clouds',accent:'#ff9f43'},
  {id:2,name:'NEON CIRCUIT',sky:0x020210,fog:0x010108,fogD:.020,gnd:0x020210,road:0x0a0a18,wall:0x3d1a6e,amb:0x080018,sun:0x8844ff,sunPos:[0,300,0],tree:0x0a0020,vibe:'Underground circuit · Crowds · Holographic',accent:'#7c3aed'}
];
const RATINGS=[{min:0,g:'F',t:"What was that?"},{min:100,g:'D',t:"Keep trying."},{min:300,g:'C',t:"Getting there."},{min:700,g:'B',t:"Not bad."},{min:1500,g:'A',t:"Nice driving."},{min:3000,g:'S',t:"That was smooth."},{min:6000,g:'S+',t:"Are you even human?"},{min:12000,g:'LEGEND',t:"They call you the Ghost."}];

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
const G={
  coins:0,unlocked:[0],colors:{},selCar:0,selMap:0,
  best:[{s:0,d:0,c:0},{s:0,d:0,c:0},{s:0,d:0,c:0}],ghosts:[null,null,null],
  running:false,paused:false,
  score:0,bestDrift:0,bestCombo:0,driftCnt:0,nmCnt:0,coinsEarned:0,coinProg:0,
  // physics
  px:0,pz:0,heading:0,speed:0,latV:0,grip:1,handbrake:false,
  vx:0,vz:0,yawRate:0,rearGrip:1,
  spinout:false,spinT:0,tireWear:1,driftAngle:0,gear:1,rpm:0,
  // drift scoring
  drifting:false,dScore:0,dDur:0,dMult:1,dEndT:0,combo:0,
  // cam
  camSmX:0,camSmZ:0,camSmY:0,shake:0,
  // misc
  t:0,frame:0,weatherT:0,
  ghRec:[],ghPlay:null,ghF:0,
  particles:[],
};

// ═══════════════════════════════════════════════════════════
// PERSISTENCE
// ═══════════════════════════════════════════════════════════
const Sv={
  load(){try{const d=JSON.parse(localStorage.getItem('dl4')||'{}');G.coins=d.coins||0;G.unlocked=d.unlocked||[0];G.colors=d.colors||{};G.selCar=d.selCar||0;G.best=d.best||G.best;G.ghosts=d.ghosts||[null,null,null];}catch(e){}},
  save(){try{localStorage.setItem('dl4',JSON.stringify({coins:G.coins,unlocked:G.unlocked,colors:G.colors,selCar:G.selCar,best:G.best,ghosts:G.ghosts.map(g=>g?g.slice(0,2500):null)}));}catch(e){}}
};

// ═══════════════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════════════
const K={};
addEventListener('keydown',e=>{K[e.code]=true;if(e.code==='Escape'&&G.running){G.paused?UI.resume():UI.pause();}if(e.code==='KeyQ'&&G.running&&!G.paused)UI.endSess();e.code==='Space'&&e.preventDefault();});
addEventListener('keyup',e=>{K[e.code]=false;});
const In={fwd:()=>K.KeyW||K.ArrowUp,bk:()=>K.KeyS||K.ArrowDown,lt:()=>K.KeyA||K.ArrowLeft,rt:()=>K.KeyD||K.ArrowRight,hb:()=>K.Space};

// ═══════════════════════════════════════════════════════════
// SOUND
// ═══════════════════════════════════════════════════════════
const Snd={
  ctx:null,master:null,eng:null,engG:null,sqG:null,sqF:null,muted:false,
  init(){
    try{
      this.ctx=new(AudioContext||webkitAudioContext)();
      this.master=this.ctx.createGain();this.master.gain.value=.65;this.master.connect(this.ctx.destination);
      this.eng=this.ctx.createOscillator();this.eng.type='sawtooth';
      this.engG=this.ctx.createGain();this.engG.gain.value=0;
      const ws=this.ctx.createWaveShaper();const cv=new Float32Array(256);for(let i=0;i<256;i++){const x=i*2/256-1;cv[i]=x*.65;}ws.curve=cv;
      this.eng.connect(ws);ws.connect(this.engG);this.engG.connect(this.master);this.eng.start();
      const bsz=this.ctx.sampleRate*2,nb=this.ctx.createBuffer(1,bsz,this.ctx.sampleRate),nd=nb.getChannelData(0);
      for(let i=0;i<bsz;i++)nd[i]=Math.random()*2-1;
      this.sqF=this.ctx.createBiquadFilter();this.sqF.type='bandpass';this.sqF.frequency.value=850;this.sqF.Q.value=4;
      this.sqG=this.ctx.createGain();this.sqG.gain.value=0;
      const ns=this.ctx.createBufferSource();ns.buffer=nb;ns.loop=true;ns.connect(this.sqF);this.sqF.connect(this.sqG);this.sqG.connect(this.master);ns.start();
    }catch(e){}
  },
  tick(sp,max,da){
    if(!this.ctx||this.muted)return;
    if(this.ctx.state==='suspended')this.ctx.resume();
    const car=CARS[G.selCar],r=sp/max;
    this.eng.frequency.setTargetAtTime(car.tone+r*car.tone*3+(G.handbrake?45:0),this.ctx.currentTime,.07);
    this.engG.gain.setTargetAtTime(G.running&&!G.paused?.06+r*.1:0,this.ctx.currentTime,.1);
    const sv=da>14?Math.min(.16,(da-14)/60*.16):0;
    this.sqG.gain.setTargetAtTime(sv,this.ctx.currentTime,.04);
    if(this.sqF)this.sqF.frequency.setTargetAtTime(650+da*9,this.ctx.currentTime,.05);
  },
  beep(f,v,d,t='sine'){if(!this.ctx||this.muted)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+d);o.connect(g);g.connect(this.master);o.start();o.stop(this.ctx.currentTime+d+.01);},
  coin(){[523,659,784].forEach((f,i)=>setTimeout(()=>this.beep(f,.1,.2),i*75));},
  unlock(){[261,329,392,523,659,784].forEach((f,i)=>setTimeout(()=>this.beep(f,.14,.25,'triangle'),i*85));},
  combo(n){const fs=n>=20?[523,659,784,1047]:n>=10?[392,523,659]:[329,415];fs.forEach((f,i)=>setTimeout(()=>this.beep(f,.07,.15,'square'),i*50));},
  hit(v){this.beep(80+v*50,.22,.35,'sawtooth');},
  toggle(){this.muted=!this.muted;if(this.master)this.master.gain.value=this.muted?0:.65;document.getElementById('mute-btn').textContent=this.muted?'🔇':'🔊';document.getElementById('vbtn').textContent=this.muted?'SOUND: OFF':'SOUND: ON';}
};

// TRACK
// ═══════════════════════════════════════════════════════════
const Trk={
  pts:[],wl:[],wr:[],HW:13,
  gen(mi){
    this.pts=[];this.wl=[];this.wr=[];
    const shapes=[
      [{x:-600,z:-300},{x:-200,z:-700},{x:400,z:-600},{x:800,z:-200},{x:700,z:400},{x:200,z:700},{x:-300,z:600},{x:-700,z:200},{x:-900,z:-100}],
      [{x:-700,z:-400},{x:-100,z:-800},{x:500,z:-500},{x:600,z:100},{x:100,z:500},{x:-200,z:700},{x:-600,z:400},{x:-800,z:0}],
      [{x:-700,z:-500},{x:-100,z:-600},{x:600,z:-400},{x:700,z:200},{x:300,z:700},{x:-200,z:600},{x:-700,z:200},{x:-900,z:-100}]
    ][mi];
    const n=shapes.length,N=700;
    for(let i=0;i<N;i++){
      const t=i/N*n,i0=Math.floor(t),f=t-i0;
      const p0=shapes[(i0-1+n)%n],p1=shapes[i0%n],p2=shapes[(i0+1)%n],p3=shapes[(i0+2)%n];
      const x=.5*((2*p1.x)+(-p0.x+p2.x)*f+(2*p0.x-5*p1.x+4*p2.x-p3.x)*f*f+(-p0.x+3*p1.x-3*p2.x+p3.x)*f*f*f);
      const z=.5*((2*p1.z)+(-p0.z+p2.z)*f+(2*p0.z-5*p1.z+4*p2.z-p3.z)*f*f+(-p0.z+3*p1.z-3*p2.z+p3.z)*f*f*f);
      this.pts.push({x,z});
    }
    for(let i=0;i<this.pts.length;i++){
      const a=this.pts[i],b=this.pts[(i+1)%this.pts.length];
      const dx=b.x-a.x,dz=b.z-a.z,l=Math.sqrt(dx*dx+dz*dz)||1;
      const nx=-dz/l,nz=dx/l;
      this.wl.push({x:a.x+nx*this.HW,z:a.z+nz*this.HW});
      this.wr.push({x:a.x-nx*this.HW,z:a.z-nz*this.HW});
    }
  },
  near(x,z){let b=0,bd=1e9;for(let i=0;i<this.pts.length;i+=5){const p=this.pts[i],d=(p.x-x)**2+(p.z-z)**2;if(d<bd){bd=d;b=i;}}return b;},
  wdist(x,z){const ni=this.near(x,z),wl=this.wl[ni],wr=this.wr[ni];return Math.min(Math.sqrt((wl.x-x)**2+(wl.z-z)**2),Math.sqrt((wr.x-x)**2+(wr.z-z)**2));},
  start(){const p=this.pts[0],p2=this.pts[3];return{x:p.x,z:p.z,h:Math.atan2(p2.x-p.x,p2.z-p.z)};}
};

// ── ROAD TEXTURE ─────────────────────────────────────────────
function makeRoadTex(mapId){
  const c=document.createElement('canvas');c.width=512;c.height=512;
  const ctx=c.getContext('2d');
  const M=MAPS[mapId];
  // base asphalt
  if(mapId===0){ctx.fillStyle='#0f1520';}
  else if(mapId===1){ctx.fillStyle='#7a7060';}
  else{ctx.fillStyle='#0a0a18';}
  ctx.fillRect(0,0,512,512);
  // noise texture
  for(let i=0;i<8000;i++){
    const x=Math.random()*512,y=Math.random()*512,r=Math.random()*1.5;
    const a=mapId===1?.12:.08;
    ctx.fillStyle=`rgba(${mapId===1?200:255},${mapId===1?190:255},${mapId===1?160:255},${Math.random()*a})`;
    ctx.fillRect(x,y,r,r);
  }
  // center line dashes
  ctx.strokeStyle=mapId===2?'rgba(124,58,237,.8)':'rgba(255,255,255,.35)';
  ctx.setLineDash([40,30]);ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(256,0);ctx.lineTo(256,512);ctx.stroke();ctx.setLineDash([]);
  // edge lines
  ctx.strokeStyle=mapId===1?'rgba(255,255,200,.5)':'rgba(255,255,255,.2)';
  ctx.lineWidth=4;ctx.setLineDash([]);
  ctx.beginPath();ctx.moveTo(48,0);ctx.lineTo(48,512);ctx.stroke();
  ctx.beginPath();ctx.moveTo(464,0);ctx.lineTo(464,512);ctx.stroke();
  if(mapId===0){
    // wet sheen
    for(let i=0;i<30;i++){
      const x=Math.random()*512,y=Math.random()*512;
      const g=ctx.createRadialGradient(x,y,0,x,y,40+Math.random()*60);
      g.addColorStop(0,'rgba(0,180,255,.06)');g.addColorStop(1,'transparent');
      ctx.fillStyle=g;ctx.fillRect(x-80,y-80,160,160);
    }
  }
  const tex=new THREE.CanvasTexture(c);
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  tex.repeat.set(1,40);
  return tex;
}

// ── SCENE BUILD ───────────────────────────────────────────────
function buildScene(mapId){
  while(scene.children.length)scene.remove(scene.children[0]);
  activeSmoke=[];smokePool=[];
  const M=MAPS[mapId];
  scene.background=new THREE.Color(M.sky);
  scene.fog=new THREE.FogExp2(M.fog,M.fogD);

  // hemisphere sky light
  const hemi=new THREE.HemisphereLight(M.sky,M.gnd,.5);
  scene.add(hemi);

  // sun
  const sun=new THREE.DirectionalLight(M.sun,2.2);
  sun.position.set(...M.sunPos);
  sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.near=1;sun.shadow.camera.far=2000;
  sun.shadow.camera.left=-400;sun.shadow.camera.right=400;
  sun.shadow.camera.top=400;sun.shadow.camera.bottom=-400;
  sun.shadow.bias=-.0005;
  scene.add(sun);

  // fill light
  const fill=new THREE.DirectionalLight(M.amb,.4);
  fill.position.set(-M.sunPos[0],M.sunPos[1],-M.sunPos[2]);
  scene.add(fill);

  // ground
  const gGeo=new THREE.PlaneGeometry(3000,3000);
  const gMat=new THREE.MeshStandardMaterial({color:M.gnd,roughness:1,metalness:0});
  const gnd=new THREE.Mesh(gGeo,gMat);
  gnd.rotation.x=-Math.PI/2;gnd.receiveShadow=true;scene.add(gnd);

  // road mesh
  buildRoad(mapId);

  // guardrails + scenery
  buildGuardrails(mapId);
  buildTrees(mapId);
  buildProps(mapId);

  // car
  carGrp=buildCar(G.selCar,G.colors[G.selCar]||0,false);
  scene.add(carGrp);

  // ghost
  ghostGrp=buildCar(G.selCar,G.colors[G.selCar]||0,true);
  ghostGrp.visible=false;scene.add(ghostGrp);

  // rival
  if(G.unlocked.includes(2)){
    rivalGrp=buildCar(1,1,false);rivalGrp.visible=true;scene.add(rivalGrp);
  } else {rivalGrp=null;}

  // rain
  if(mapId===0)buildRain();else rainPts=null;

  // sun flare sprite
  if(mapId===1||mapId===2){
    const flareGeo=new THREE.PlaneGeometry(40,40);
    const flareMat=new THREE.MeshBasicMaterial({color:mapId===1?0xffee88:0x9944ff,transparent:true,opacity:.35,depthWrite:false,blending:THREE.AdditiveBlending});
    const flare=new THREE.Mesh(flareGeo,flareMat);
    flare.position.set(...M.sunPos);
    scene.add(flare);
    scene.userData.flare=flare;
  }
}

function buildRoad(mapId){
  const pts=Trk.pts,wl=Trk.wl,wr=Trk.wr,n=pts.length;
  const verts=[],uvs=[],inds=[],normals=[];
  for(let i=0;i<n;i++){
    const l=wl[i],r=wr[i];
    verts.push(l.x,.02,l.z,r.x,.02,r.z);
    normals.push(0,1,0,0,1,0);
    uvs.push(0,i*.07,1,i*.07);
  }
  for(let i=0;i<n-1;i++){const a=i*2,b=a+1,c=a+2,d=a+3;inds.push(a,b,c,b,d,c);}
  const a=(n-1)*2,b=a+1;inds.push(a,b,0,b,1,0);
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
  geo.setAttribute('normal',new THREE.Float32BufferAttribute(normals,3));
  geo.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
  geo.setIndex(inds);
  const tex=makeRoadTex(mapId);
  const mat=new THREE.MeshStandardMaterial({map:tex,roughness:.85,metalness:mapId===0?.2:0});
  const mesh=new THREE.Mesh(geo,mat);mesh.receiveShadow=true;scene.add(mesh);
}

function buildGuardrails(mapId){
  const M=MAPS[mapId];
  const wMat=new THREE.MeshStandardMaterial({color:mapId===2?0x5522aa:0xcccccc,roughness:.4,metalness:.7});
  const postMat=new THREE.MeshStandardMaterial({color:0x888888,roughness:.5,metalness:.5});
  const n=Trk.pts.length;
  for(let side=0;side<2;side++){
    const wall=side===0?Trk.wl:Trk.wr;
    for(let i=0;i<n;i+=3){
      const a=wall[i],b=wall[(i+3)%n];
      const dx=b.x-a.x,dz=b.z-a.z,l=Math.sqrt(dx*dx+dz*dz);
      if(l<.1)continue;
      // guardrail beam
      const beam=new THREE.Mesh(new THREE.BoxGeometry(l,.25,.08),wMat);
      beam.position.set((a.x+b.x)/2,.5,(a.z+b.z)/2);
      beam.rotation.y=-Math.atan2(dx,dz);beam.castShadow=true;scene.add(beam);
      // lower beam
      const beam2=new THREE.Mesh(new THREE.BoxGeometry(l,.25,.08),wMat);
      beam2.position.set((a.x+b.x)/2,.25,(a.z+b.z)/2);
      beam2.rotation.y=-Math.atan2(dx,dz);scene.add(beam2);
    }
    // posts every 6 segments
    for(let i=0;i<n;i+=6){
      const p=wall[i];
      const post=new THREE.Mesh(new THREE.BoxGeometry(.12,.7,.12),postMat);
      post.position.set(p.x,.35,p.z);post.castShadow=true;scene.add(post);
    }
  }
}

function buildTrees(mapId){
  const M=MAPS[mapId];
  // trunk
  const trunkMat=new THREE.MeshStandardMaterial({color:0x4a2c0a,roughness:1});
  // foliage — multiple shades for depth
  const leafColors=[0x1a4a10,0x1e5614,0x254d18,0x2d6020,0x0e3808];
  const leafMats=leafColors.map(c=>new THREE.MeshStandardMaterial({color:c,roughness:1}));
  const n=Trk.pts.length;
  for(let side=0;side<2;side++){
    const wall=side===0?Trk.wl:Trk.wr;
    for(let i=0;i<n;i+=8){
      const p=Trk.pts[i],w=wall[i];
      const dx=w.x-p.x,dz=w.z-p.z,l=Math.sqrt(dx*dx+dz*dz)||1;
      const nx=dx/l,nz=dz/l;
      const offset=3+Math.random()*4;
      const tx=w.x+nx*offset+(Math.random()-.5)*3;
      const tz=w.z+nz*offset+(Math.random()-.5)*3;
      const h=4+Math.random()*6;
      const treeGrp=new THREE.Group();
      // trunk
      const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18,.25,h*.4,6),trunkMat);
      trunk.position.y=h*.2;treeGrp.add(trunk);
      // foliage layers
      const lm=leafMats[Math.floor(Math.random()*leafMats.length)];
      const layers=2+Math.floor(Math.random()*2);
      for(let li=0;li<layers;li++){
        const r=1.2+Math.random()*1.8,lh=2+Math.random()*2;
        const leaf=new THREE.Mesh(new THREE.ConeGeometry(r,lh,8),lm);
        leaf.position.y=h*.3+li*lh*.6;treeGrp.add(leaf);
      }
      treeGrp.position.set(tx,0,tz);
      treeGrp.rotation.y=Math.random()*Math.PI*2;
      treeGrp.castShadow=true;
      scene.add(treeGrp);
    }
  }
}

function buildProps(mapId){
  const n=Trk.pts.length;
  if(mapId===0){
    // power poles
    const poleMat=new THREE.MeshStandardMaterial({color:0x554433,roughness:1});
    const wireMat=new THREE.MeshBasicMaterial({color:0x222222});
    for(let i=0;i<n;i+=25){
      const p=Trk.pts[i],w=Trk.wl[i];
      const dx=w.x-p.x,dz=w.z-p.z,l=Math.sqrt(dx*dx+dz*dz)||1;
      const pole=new THREE.Mesh(new THREE.CylinderGeometry(.15,.2,9,6),poleMat);
      pole.position.set(w.x+dx/l*5,4.5,w.z+dz/l*5);
      pole.castShadow=true;scene.add(pole);
      // street light
      const light=new THREE.PointLight(0xff8844,.6,35,2);
      light.position.set(w.x+dx/l*5,9,w.z+dz/l*5);scene.add(light);
      const bulb=new THREE.Mesh(new THREE.SphereGeometry(.3,6,6),new THREE.MeshBasicMaterial({color:0xff9955}));
      bulb.position.copy(light.position);scene.add(bulb);
    }
    // road signs
    const signMat=new THREE.MeshStandardMaterial({color:0xffdd00,roughness:.3,metalness:.2});
    for(let i=0;i<n;i+=60){
      const w=Trk.wl[i];
      const sign=new THREE.Mesh(new THREE.BoxGeometry(1,.8,.05),signMat);
      sign.position.set(w.x,2,w.z);scene.add(sign);
    }
  } else if(mapId===1){
    // canyon boulders
    const rockMat=new THREE.MeshStandardMaterial({color:0x8b4513,roughness:.95});
    for(let i=0;i<n;i+=15){
      const side=Math.random()>.5?Trk.wl[i]:Trk.wr[i];
      const p=Trk.pts[i];const dx=side.x-p.x,dz=side.z-p.z,l=Math.sqrt(dx*dx+dz*dz)||1;
      const r=new THREE.Mesh(new THREE.DodecahedronGeometry(1+Math.random()*2,0),rockMat);
      r.position.set(side.x+dx/l*3,0,side.z+dz/l*3);
      r.rotation.set(Math.random(),Math.random(),Math.random());
      r.castShadow=true;scene.add(r);
    }
    // orange traffic cones
    const coneMat=new THREE.MeshStandardMaterial({color:0xff6600,roughness:.6});
    for(let i=0;i<n;i+=20){
      const side=i%40===0?Trk.wl[i]:Trk.wr[i];
      const cone=new THREE.Mesh(new THREE.ConeGeometry(.2,.5,8),coneMat);
      cone.position.set(side.x,0.25,side.z);scene.add(cone);
    }
  } else {
    // neon strip lights along track
    for(let i=0;i<n;i+=4){
      const wl=Trk.wl[i],wr=Trk.wr[i];
      [[wl,0x7c3aed],[wr,0x06b6d4]].forEach(([w,col])=>{
        const m=new THREE.Mesh(new THREE.BoxGeometry(.3,.06,.3),new THREE.MeshBasicMaterial({color:col}));
        m.position.set(w.x,.04,w.z);scene.add(m);
        if(i%20===0){const l=new THREE.PointLight(col,.5,20,2);l.position.set(w.x,.5,w.z);scene.add(l);}
      });
    }
    // crowd silhouettes
    const crowdMat=new THREE.MeshBasicMaterial({color:0x111133});
    for(let i=0;i<n;i+=10){
      const side=Math.random()>.5?Trk.wl[i]:Trk.wr[i];
      const p=Trk.pts[i];const dx=side.x-p.x,dz=side.z-p.z,l=Math.sqrt(dx*dx+dz*dz)||1;
      const person=new THREE.Mesh(new THREE.BoxGeometry(.4,1.7,.3),crowdMat);
      person.position.set(side.x+dx/l*2,.85,side.z+dz/l*2);scene.add(person);
    }
  }
}

function buildRain(){
  const N=3000,pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){pos[i*3]=(Math.random()-.5)*600;pos[i*3+1]=Math.random()*80;pos[i*3+2]=(Math.random()-.5)*600;}
  rainBuf=pos;
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const mat=new THREE.PointsMaterial({color:0x8899bb,size:.2,transparent:true,opacity:.4,depthWrite:false});
  rainPts=new THREE.Points(geo,mat);scene.add(rainPts);
}

// ── CAR MODEL (detailed) ─────────────────────────────────────
function buildCar(carId,colorIdx,ghost){
  const grp=new THREE.Group();
  const col=CCOLORS[colorIdx||0];
  const op=ghost?.32:1;
  const bMat=new THREE.MeshStandardMaterial({color:col[0],roughness:.25,metalness:.7,transparent:ghost,opacity:op});
  const dMat=new THREE.MeshStandardMaterial({color:col[1],roughness:.3,metalness:.5,transparent:ghost,opacity:op});
  const gMat=new THREE.MeshStandardMaterial({color:0x112233,roughness:.05,metalness:.9,transparent:true,opacity:ghost?.2:.7});
  const wMat=new THREE.MeshStandardMaterial({color:0x111111,roughness:.8,metalness:.1});
  const rMat=new THREE.MeshStandardMaterial({color:carId===3?0xc8a000:0x888888,roughness:.3,metalness:.9});
  const blkMat=new THREE.MeshStandardMaterial({color:0x080808,roughness:.5,metalness:.2});
  const lightMat=new THREE.MeshStandardMaterial({color:0xffddaa,emissive:0xffddaa,emissiveIntensity:.4,roughness:.1,metalness:.5});
  const tailMat=new THREE.MeshStandardMaterial({color:0xff1111,emissive:0xff0000,emissiveIntensity:.5,roughness:.1,metalness:.5});

  // proportions by car id
  const P=[
    {bl:4.2,bw:1.85,bh:.42,roff:.08,rlen:2.0,rwid:1.7,rh:.52,windA:.38,hoodL:1.4},
    {bl:4.5,bw:1.80,bh:.40,roff:.05,rlen:2.1,rwid:1.65,rh:.54,windA:.42,hoodL:1.5},
    {bl:4.6,bw:1.95,bh:.42,roff:.02,rlen:2.0,rwid:1.78,rh:.52,windA:.40,hoodL:1.45},
    {bl:4.8,bw:1.90,bh:.44,roff:.06,rlen:2.2,rwid:1.74,rh:.56,windA:.44,hoodL:1.6},
    {bl:4.9,bw:1.92,bh:.38,roff:.0,rlen:2.0,rwid:1.78,rh:.48,windA:.36,hoodL:1.5},
    {bl:5.0,bw:2.05,bh:.36,roff:-.02,rlen:2.1,rwid:1.90,rh:.46,windA:.34,hoodL:1.55}
  ][carId]||{bl:4.2,bw:1.85,bh:.42,roff:.08,rlen:2.0,rwid:1.7,rh:.52,windA:.38,hoodL:1.4};

  const Y=.36; // ride height
  const {bl,bw,bh,roff,rlen,rwid,rh,windA,hoodL}=P;

  // ── body lower ──
  const bodyGeo=new THREE.BoxGeometry(bw,bh,bl);
  const body=new THREE.Mesh(bodyGeo,bMat);
  body.position.set(0,Y+bh/2,0);body.castShadow=true;grp.add(body);

  // ── hood slope (front) ──
  const hoodGeo=new THREE.BoxGeometry(bw-.1,.15,hoodL);
  const hood=new THREE.Mesh(hoodGeo,bMat);
  hood.position.set(0,Y+bh+.07,bl*.5-hoodL*.5-.05);
  hood.rotation.x=-.12;hood.castShadow=true;grp.add(hood);

  // ── cabin ──
  const cabGeo=new THREE.BoxGeometry(rwid,rh,rlen);
  const cab=new THREE.Mesh(cabGeo,dMat);
  cab.position.set(0,Y+bh+rh/2,roff);cab.castShadow=true;grp.add(cab);

  // ── windshield ──
  const windGeo=new THREE.BoxGeometry(rwid*.96,.04,rlen*.4);
  const wind=new THREE.Mesh(windGeo,gMat);
  wind.position.set(0,Y+bh+rh*.95,roff+rlen*.28);
  wind.rotation.x=-windA;grp.add(wind);

  // ── rear window ──
  const rwGeo=new THREE.BoxGeometry(rwid*.94,.04,rlen*.35);
  const rw=new THREE.Mesh(rwGeo,gMat);
  rw.position.set(0,Y+bh+rh*.88,roff-rlen*.22);
  rw.rotation.x=windA*.9;grp.add(rw);

  // ── side windows ──
  [-rwid/2-.01,rwid/2+.01].forEach(sx=>{
    const swGeo=new THREE.BoxGeometry(.02,rh*.65,rlen*.82);
    const sw=new THREE.Mesh(swGeo,gMat);
    sw.position.set(sx,Y+bh+rh*.55,roff-.02);grp.add(sw);
  });

  // ── front bumper ──
  const fbGeo=new THREE.BoxGeometry(bw+.06,.2,bh*.5);
  const fb=new THREE.Mesh(fbGeo,blkMat);
  fb.position.set(0,Y+.06,bl/2+.04);grp.add(fb);

  // ── rear bumper ──
  const rbGeo=new THREE.BoxGeometry(bw+.04,.18,bh*.4);
  const rb=new THREE.Mesh(rbGeo,blkMat);
  rb.position.set(0,Y+.06,-bl/2-.04);grp.add(rb);

  // ── spoiler (cars 2+) ──
  if(carId>=2){
    const spkMat=new THREE.MeshStandardMaterial({color:0x111111,roughness:.4,metalness:.4});
    const wing=new THREE.Mesh(new THREE.BoxGeometry(bw*.9,.06,.7),spkMat);
    wing.position.set(0,Y+bh+rh+.08,-bl*.4);grp.add(wing);
    [-bw*.38,bw*.38].forEach(sx=>{
      const strut=new THREE.Mesh(new THREE.BoxGeometry(.1,.4,.1),spkMat);
      strut.position.set(sx,Y+bh+rh-.08,-bl*.4);grp.add(strut);
    });
  }

  // ── headlights ──
  [{z:bl/2+.01,mat:lightMat,isHead:true},{z:-bl/2-.01,mat:tailMat,isHead:false}].forEach(({z,mat,isHead})=>{
    [-bw*.38,bw*.38].forEach(sx=>{
      const lg=new THREE.Mesh(new THREE.BoxGeometry(.32,.14,.04),mat);
      lg.position.set(sx,Y+bh*.65,z);grp.add(lg);
      if(isHead&&!ghost){
        const l=new THREE.SpotLight(0xfff5e0,1.5,30,.3,.5,1.5);
        l.position.set(sx,Y+bh*.65,z+.2);
        l.target.position.set(sx,Y-1,z+15);
        scene.add(l.target);scene.add(l);
        grp.userData['hl'+sx]=l;
      }
    });
  });

  // ── license plate ──
  const plateMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.4});
  const plate=new THREE.Mesh(new THREE.BoxGeometry(.4,.15,.01),plateMat);
  plate.position.set(0,Y+bh*.4,-bl/2-.06);grp.add(plate);

  // ── wheels ──
  const wheelR=.32,wheelW=.22;
  const wPositions=[
    [bw/2+wheelW/2,wheelR,bl*.32,true],[-(bw/2+wheelW/2),wheelR,bl*.32,true],
    [bw/2+wheelW/2,wheelR,-bl*.32,false],[-(bw/2+wheelW/2),wheelR,-bl*.32,false]
  ];
  grp.userData.wheels=[];
  wPositions.forEach(([wx,wy,wz,front])=>{
    const wg=new THREE.Group();
    // tyre
    const tyre=new THREE.Mesh(new THREE.CylinderGeometry(wheelR,wheelR,wheelW,20),wMat);
    tyre.rotation.z=Math.PI/2;wg.add(tyre);
    // rim
    const rim=new THREE.Mesh(new THREE.CylinderGeometry(wheelR*.62,wheelR*.62,wheelW+.02,8),rMat);
    rim.rotation.z=Math.PI/2;wg.add(rim);
    // spokes
    for(let s=0;s<5;s++){
      const sp=new THREE.Mesh(new THREE.BoxGeometry(wheelR*.55,.04,wheelW*.8),rMat);
      sp.rotation.x=s/5*Math.PI*2;wg.add(sp);
    }
    // wheel arch
    const archGeo=new THREE.TorusGeometry(wheelR+.06,.06,8,16,.9);
    const arch=new THREE.Mesh(archGeo,bMat);
    arch.position.x=Math.sign(wx)*(.05);arch.rotation.y=Math.sign(wx)===1?0:Math.PI;wg.add(arch);
    wg.position.set(wx,wy,wz);wg.userData.front=front;
    grp.add(wg);grp.userData.wheels.push(wg);
  });

  // ── brake caliper glow ──
  if(!ghost){
    grp.userData.wheels.forEach(wg=>{
      const cal=new THREE.Mesh(new THREE.BoxGeometry(.08,.12,.18),new THREE.MeshStandardMaterial({color:0xff2200,emissive:0xff2200,emissiveIntensity:.0}));
      cal.position.set(0,0,-.05);wg.add(cal);wg.userData.caliper=cal;
    });
  }

  return grp;
}

// ── SMOKE PARTICLES ───────────────────────────────────────────
const smokeGeo=new THREE.SphereGeometry(.55,6,4);
function getSmoke(color){
  const m=new THREE.Mesh(smokeGeo,new THREE.MeshBasicMaterial({color,transparent:true,opacity:.5,depthWrite:false,blending:THREE.AdditiveBlending}));
  return m;
}
function spawnSmoke(x,y,z){
  const car=CARS[G.selCar];
  const tint=G.tireWear>.5?car.trail:'#888888';
  const col=new THREE.Color(tint);
  for(let i=0;i<3;i++){
    const s=getSmoke(col);
    s.position.set(x+(Math.random()-.5)*.6,y+.3+Math.random()*.3,z+(Math.random()-.5)*.6);
    s.userData={vx:(Math.random()-.5)*.04,vy:.012+Math.random()*.015,vz:(Math.random()-.5)*.04,life:1.4,sc:1};
    scene.add(s);activeSmoke.push(s);
  }
}
function tickSmoke(dt){
  for(let i=activeSmoke.length-1;i>=0;i--){
    const s=activeSmoke[i];const u=s.userData;
    u.life-=.015*dt*60;
    s.material.opacity=Math.max(0,u.life*.38);
    s.position.x+=u.vx;s.position.y+=u.vy;s.position.z+=u.vz;
    u.sc+=.012;s.scale.setScalar(u.sc);
    if(u.life<=0){scene.remove(s);activeSmoke.splice(i,1);}
  }
}

// ═══════════════════════════════════════════════════════════
// PHYSICS (bicycle model — world velocity vector)
// ═══════════════════════════════════════════════════════════
function physTick(dt){
  if(!G.running||G.paused)return;
  const car=CARS[G.selCar];
  const max=car.topSpd;

  // ── spinout recovery ──────────────────────────────────────
  if(G.spinout){
    G.spinT-=dt*1000;
    const absSpd=Math.sqrt(G.vx*G.vx+G.vz*G.vz);
    G.vx*=Math.pow(.90,dt*60);G.vz*=Math.pow(.90,dt*60);
    G.yawRate*=Math.pow(.80,dt*60);
    G.heading+=G.yawRate*dt;
    G.px+=G.vx*dt;G.pz+=G.vz*dt;
    G.speed=absSpd;
    if(G.spinT<=0){G.spinout=false;G.rearGrip=.35;G.driftAngle=0;}
    return;
  }

  // ── inputs ────────────────────────────────────────────────
  const steer=(In.rt()?1:0)-(In.lt()?1:0);
  G.handbrake=In.hb();

  // ── decompose velocity into car frame ─────────────────────
  const sinH=Math.sin(G.heading),cosH=Math.cos(G.heading);
  let fwdSpd= G.vx*sinH+G.vz*cosH;   // + = forward
  let latSpd= G.vx*cosH-G.vz*sinH;   // + = rightward

  const absSpd=Math.sqrt(G.vx*G.vx+G.vz*G.vz);
  const sr=Math.min(absSpd/max,1);

  // ── throttle / brake (act on forward component) ───────────
  if(In.fwd())fwdSpd=Math.min(fwdSpd+car.acc*dt*60*(1-.15*sr),max);
  else if(In.bk())fwdSpd=Math.max(fwdSpd-car.brk*dt*60,-max*.28);
  else fwdSpd*=Math.pow(.982,dt*60);

  // ── front grip: strongly corrects lateral slip ────────────
  const frontGrip=car.gF*(.6+G.tireWear*.4);
  const frontCorr=frontGrip*12.0;
  latSpd*=Math.pow(Math.max(0,1-frontCorr*dt),1);

  // ── rear grip: weakened by handbrake, allows sliding ──────
  if(G.handbrake){G.rearGrip=Math.max(.04,G.rearGrip-.12*dt*60);}
  else{G.rearGrip=Math.min(1,G.rearGrip+car.hb*.07*(.6+G.tireWear*.4)*dt*60);}

  const rearCorr=car.gR*G.rearGrip*9.0;
  latSpd*=Math.pow(Math.max(0,1-rearCorr*dt),1);

  // ── steering adds yaw torque ──────────────────────────────
  const steerAng=car.steer*(1-sr*.38)*steer;
  G.yawRate+=steerAng*Math.max(absSpd,1)*dt*60*.55;

  // ── oversteer: grip imbalance generates extra yaw ─────────
  // front corrects more than rear → yaw in slip direction
  const gripImbalance=(frontGrip-car.gR*G.rearGrip)*Math.abs(latSpd)*absSpd*.004;
  G.yawRate+=gripImbalance*(latSpd<0?-1:1)*dt*60;

  // ── yaw damping ───────────────────────────────────────────
  G.yawRate*=Math.pow(.78,dt*60);

  // ── apply yaw ─────────────────────────────────────────────
  G.heading+=G.yawRate*dt;

  // ── rebuild world velocity from corrected car-frame vals ──
  const sinH2=Math.sin(G.heading),cosH2=Math.cos(G.heading);
  G.vx=fwdSpd*sinH2+latSpd*cosH2;
  G.vz=fwdSpd*cosH2-latSpd*sinH2;

  // ── integrate position ────────────────────────────────────
  G.px+=G.vx*dt;
  G.pz+=G.vz*dt;

  // ── convenience scalars for HUD/scoring ──────────────────
  G.speed=Math.sqrt(G.vx*G.vx+G.vz*G.vz)*(fwdSpd<0?-1:1);
  G.latV=latSpd;
  G.driftAngle=absSpd>1?Math.atan2(latSpd,Math.max(absSpd,.01))*180/Math.PI:G.driftAngle*.88;

  // ── spinout threshold ─────────────────────────────────────
  if(Math.abs(G.driftAngle)>72&&absSpd>8){
    G.spinout=true;G.spinT=1200;Sc.onSpin();doFlash('#ff000033');
    const sp=document.getElementById('spin-msg');sp.style.display='block';
    setTimeout(()=>sp.style.display='none',950);
  }

  // ── wall collision ────────────────────────────────────────
  const wd=Trk.wdist(G.px,G.pz);
  if(wd<Trk.HW-1.2){
    const ni=Trk.near(G.px,G.pz),tp=Trk.pts[ni];
    const dx=G.px-tp.x,dz=G.pz-tp.z,d=Math.sqrt(dx*dx+dz*dz)||1;
    const pd=Trk.HW-1.5;
    if(d>pd){
      G.px=tp.x+dx/d*pd;G.pz=tp.z+dz/d*pd;
      // reflect velocity off wall normal
      const nx=dx/d,nz=dz/d;
      const dot=G.vx*nx+G.vz*nz;
      const impact=Math.abs(dot)/max;
      if(impact>.04){
        G.vx-=dot*nx*1.4;G.vz-=dot*nz*1.4;
        G.vx*=.45;G.vz*=.45;
        G.yawRate*=.3;
        G.shake=impact*11;Snd.hit(impact);Sc.breakCombo();
      }
    }
  }

  // ── tyre wear ─────────────────────────────────────────────
  if(G.drifting)G.tireWear=Math.max(0,G.tireWear-.000035*dt*60);

  // ── near miss ─────────────────────────────────────────────
  if(wd<Trk.HW-.5&&wd>Trk.HW-3&&G.drifting)Sc.nearMiss();

  // ── gears / rpm ───────────────────────────────────────────
  G.gear=Math.max(1,Math.min(6,Math.ceil(sr*6)));G.rpm=sr;

  // ── brake caliper glow ────────────────────────────────────
  if(carGrp&&carGrp.userData.wheels){
    carGrp.userData.wheels.forEach(w=>{if(w.userData.caliper)w.userData.caliper.material.emissiveIntensity=In.bk()?1.5:0;});
  }

  // ── smoke ─────────────────────────────────────────────────
  if(G.drifting&&G.frame%2===0){
    const rx=G.px-Math.sin(G.heading)*3.6,rz=G.pz-Math.cos(G.heading)*3.6;
    spawnSmoke(rx,.3,rz);
  }

  Snd.tick(absSpd,max,Math.abs(G.driftAngle));
}

// ═══════════════════════════════════════════════════════════
// SCORING
// ═══════════════════════════════════════════════════════════
const Sc={
  nmCd:0,
  tick(dt){
    if(!G.running||G.paused||G.spinout)return;
    if(this.nmCd>0)this.nmCd-=dt*1000;
    const ang=Math.abs(G.driftAngle),sp=Math.abs(G.speed);
    if(ang>=14&&ang<76&&sp>3){
      if(!G.drifting){
        G.drifting=true;G.dScore=0;G.dDur=0;G.driftCnt++;
        const now=Date.now();
        if(now-G.dEndT<1500){G.combo++;if(G.combo===5||G.combo===10||G.combo===20)Snd.combo(G.combo);this.updC();}
        else{G.combo=1;this.updC();}
      }
      G.dDur+=dt;
      const tm=G.dDur>10?3:G.dDur>6?2:G.dDur>3?1.5:1;
      G.dMult=tm*(1+(G.combo-1)*.12);
      G.dScore+=ang*(sp*.18)*.03*G.dMult*dt*60;
      const dd=document.getElementById('drift-live');
      dd.style.display='block';
      document.getElementById('drift-pts').textContent=Math.floor(G.dScore).toLocaleString();
      document.getElementById('drift-mult').textContent='×'+G.dMult.toFixed(1);
    } else if(G.drifting){
      G.drifting=false;G.dEndT=Date.now();
      document.getElementById('drift-live').style.display='none';
      if(G.dScore>1){
        const pts=Math.floor(G.dScore);G.score+=pts;
        if(pts>G.bestDrift)G.bestDrift=pts;
        G.coinProg+=pts;const ce=Math.floor(G.coinProg/100);
        if(ce>0){G.coinProg-=ce*100;G.coinsEarned+=ce;Snd.coin();}
        UI.updHUD();showNotif('+'+pts.toLocaleString());
      }
      G.dScore=0;G.dDur=0;
    } else {if(G.combo>0&&Date.now()-G.dEndT>1500)this.breakCombo();}
  },
  nearMiss(){if(this.nmCd>0)return;this.nmCd=600;if(G.drifting){G.dMult+=.5;G.nmCnt++;const n=document.getElementById('near-msg');n.style.display='block';setTimeout(()=>n.style.display='none',650);}},
  onSpin(){this.breakCombo();G.drifting=false;G.dScore=0;G.score=Math.max(0,G.score-50);UI.updHUD();},
  breakCombo(){G.combo=0;document.getElementById('combo-disp').style.display='none';},
  updC(){const el=document.getElementById('combo-disp');if(G.combo>1){el.textContent=G.combo+'×';el.style.display='block';el.style.transform='translateY(-50%) scale(1.4)';setTimeout(()=>el.style.transform='translateY(-50%) scale(1)',130);if(G.combo>G.bestCombo)G.bestCombo=G.combo;}}
};

// ═══════════════════════════════════════════════════════════
// CAMERA (cinematic chase)
// ═══════════════════════════════════════════════════════════
function camTick(dt){
  const shX=G.shake>(0)?(Math.random()-.5)*G.shake*.3:0;
  const shY=G.shake>0?(Math.random()-.5)*G.shake*.15:0;
  if(G.shake>0)G.shake*=.82;

  const sr=Math.abs(G.speed)/CARS[G.selCar].topSpd;
  // dynamic camera distance: closer at slow speed, pull back at high speed
  const dist=6.5+sr*5;
  const height=1.8+sr*1.5;
  // camera positioned slightly offset based on drift
  const driftOffset=G.driftAngle*.018;

  const targetX=G.px-Math.sin(G.heading)*dist+Math.cos(G.heading)*driftOffset;
  const targetZ=G.pz-Math.cos(G.heading)*dist-Math.sin(G.heading)*driftOffset;
  const targetY=height;

  // smooth camera
  const lag=.1+sr*.04;
  G.camSmX+=(targetX-G.camSmX)*lag*dt*60;
  G.camSmZ+=(targetZ-G.camSmZ)*lag*dt*60;
  G.camSmY+=(targetY-G.camSmY)*.15*dt*60;

  camera.position.set(G.camSmX+shX,G.camSmY+shY,G.camSmZ);

  // look slightly ahead of car
  const lookX=G.px+Math.sin(G.heading)*3;
  const lookZ=G.pz+Math.cos(G.heading)*3;
  camera.lookAt(lookX,.5,lookZ);

  // FOV
  const targetFOV=58+sr*14;
  camera.fov+=(targetFOV-camera.fov)*.06*dt*60;
  camera.updateProjectionMatrix();

  // vignette via CSS
  const v=document.getElementById('vig');
  v.style.opacity=.4+sr*.45;
}

// ═══════════════════════════════════════════════════════════
// CAR MESH UPDATE
// ═══════════════════════════════════════════════════════════
function carMeshTick(dt){
  if(!carGrp)return;
  carGrp.position.set(G.px,.0,G.pz);
  carGrp.rotation.y=-G.heading;
  // body roll
  const roll=G.driftAngle*.009;
  carGrp.rotation.z=-roll;
  // suspension pitch
  const pitch=(In.fwd()&&!In.bk())?-.015:(In.bk()?.018:0);
  carGrp.rotation.x+=(pitch-carGrp.rotation.x)*.15*dt*60;

  const ws=carGrp.userData.wheels||[];
  const steer=(In.rt()?1:0)-(In.lt()?1:0);
  const sr=Math.abs(G.speed)/CARS[G.selCar].topSpd;
  ws.forEach(w=>{
    w.rotation.x-=G.speed*.05;
    if(w.userData.front)w.rotation.y=steer*.38*(1-sr*.55);
  });

  // ghost
  if(ghostGrp){
    if(G.ghPlay&&G.ghPlay.length>0){
      ghostGrp.visible=true;
      const f=G.ghPlay[Math.min(G.ghF,G.ghPlay.length-1)];
      ghostGrp.position.set(f.x,.0,f.z);ghostGrp.rotation.y=-f.h;
      G.ghF+=2;if(G.ghF>=G.ghPlay.length)G.ghF=0;
    } else ghostGrp.visible=false;
  }

  // rival
  if(rivalGrp&&rivalGrp.visible)rivalTick(dt);
}

// ═══════════════════════════════════════════════════════════
// RIVAL
// ═══════════════════════════════════════════════════════════
let rivalIdx=5,rivalX=0,rivalZ=0,rivalH=0,rivalSpd=0;
function rivalInit(){
  if(!rivalGrp){return;}
  const sp=Trk.start();rivalX=sp.x+4;rivalZ=sp.z+4;rivalH=sp.h;rivalIdx=10;
  rivalSpd=12+Math.min(G.coins/2000,10);rivalGrp.visible=true;
}
function rivalTick(dt){
  rivalIdx=(rivalIdx+2)%Trk.pts.length;
  const tp=Trk.pts[rivalIdx];
  const dx=tp.x-rivalX,dz=tp.z-rivalZ;
  const ta=Math.atan2(dx,dz);
  let da=ta-rivalH;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;
  rivalH+=da*.1;rivalX+=Math.sin(rivalH)*rivalSpd*dt;rivalZ+=Math.cos(rivalH)*rivalSpd*dt;
  rivalGrp.position.set(rivalX,.0,rivalZ);rivalGrp.rotation.y=-rivalH;
  const dist=Math.sqrt((rivalX-G.px)**2+(rivalZ-G.pz)**2);
  if(dist<10&&G.drifting&&Math.random()<.005)showNotif('TANDEM! +1×');
}

// ═══════════════════════════════════════════════════════════
// RAIN
// ═══════════════════════════════════════════════════════════
function rainTick(dt){
  if(!rainPts||!rainBuf)return;
  const speed=(.35+G.weatherT*.55)*dt*60;
  const N=rainBuf.length/3;
  for(let i=0;i<N;i++){rainBuf[i*3+1]-=speed;if(rainBuf[i*3+1]<0)rainBuf[i*3+1]=80;rainBuf[i*3]+=.06;}
  rainPts.geometry.attributes.position.needsUpdate=true;
  // follow cam
  rainPts.position.set(G.px,0,G.pz);
}

// HUD

function hudTick(){

function drawMM(){
  const cv=document.getElementById('mm'),ctx=cv.getContext('2d');
  const W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='rgba(0,0,0,.62)';ctx.fillRect(0,0,W,H);
  if(!Trk.pts.length)return;
  let mx=1e9,Mx=-1e9,mz=1e9,Mz=-1e9;
  for(const p of Trk.pts){if(p.x<mx)mx=p.x;if(p.x>Mx)Mx=p.x;if(p.z<mz)mz=p.z;if(p.z>Mz)Mz=p.z;}
  const mg=10,sc=Math.min((W-mg*2)/(Mx-mx),(H-mg*2)/(Mz-mz));
  const tx=x=>(x-mx)*sc+mg+(W-mg*2-(Mx-mx)*sc)/2;
  const tz=z=>(z-mz)*sc+mg+(H-mg*2-(Mz-mz)*sc)/2;
  ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=1.5;ctx.beginPath();
  Trk.pts.forEach((p,i)=>{i===0?ctx.moveTo(tx(p.x),tz(p.z)):ctx.lineTo(tx(p.x),tz(p.z));});
  ctx.closePath();ctx.stroke();
  ctx.fillStyle='#4db8ff';ctx.beginPath();ctx.arc(tx(G.px),tz(G.pz),4,0,Math.PI*2);ctx.fill();
  if(ghostGrp&&ghostGrp.visible){ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(tx(ghostGrp.position.x),tz(ghostGrp.position.z),3,0,Math.PI*2);ctx.fill();}
  if(rivalGrp&&rivalGrp.visible){ctx.fillStyle='#ff4444';ctx.beginPath();ctx.arc(tx(rivalX),tz(rivalZ),3,0,Math.PI*2);ctx.fill();}
}

// ═══════════════════════════════════════════════════════════
// GARAGE CANVAS
// ═══════════════════════════════════════════════════════════
let garAF=null,garId=0;
function startGarAnim(id){
  garId=id;if(garAF)cancelAnimationFrame(garAF);
  const cv=document.getElementById('gc'),ctx=cv.getContext('2d');
  const W=cv.width,H=cv.height;
  let t=0;
  const loop=()=>{
    if(!document.getElementById('sgar').classList.contains('on'))return;
    t+=16;ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#04060e';ctx.fillRect(0,0,W,H);
    const sg=ctx.createRadialGradient(W/2,H*.65,0,W/2,H*.65,H*.7);
    sg.addColorStop(0,'rgba(77,184,255,.1)');sg.addColorStop(1,'transparent');
    ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(W/2,H*.86,55,7,0,0,Math.PI*2);ctx.fill();
    drawGarCar(ctx,id,G.colors[id]||0,W/2,H/2+Math.sin(t/700)*3,t);
    garAF=requestAnimationFrame(loop);
  };loop();
}
function drawGarCar(ctx,id,ci,cx,cy,t){
  const c=CCOLORS[ci||0];
  const owned=G.unlocked.includes(id);
  if(!owned){
    ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(cx-55,cy-28,110,56);
    ctx.fillStyle='rgba(255,255,255,.28)';ctx.font='32px Inter';ctx.textAlign='center';ctx.fillText('🔒',cx,cy+11);return;
  }
  const sc=2.8;
  ctx.save();ctx.translate(cx,cy);
  // body
  ctx.fillStyle=c[0];
  const bl=4.2+id*.18,bw=1.85+id*.05;
  ctx.fillRect(-bl*sc/2,-bw*sc*.22,bl*sc,bw*sc*.44);
  // cabin
  ctx.fillStyle=c[1];
  ctx.fillRect(-bl*sc*.2,-bw*sc*.34,bl*sc*.5,bw*sc*.28);
  // windshield
  ctx.fillStyle='rgba(77,150,220,.65)';
  ctx.fillRect(-bl*sc*.06,-bw*sc*.3,bl*sc*.22,bw*sc*.22);
  // wheels
  ctx.fillStyle='#111';
  [[-bl*sc*.32,-bw*sc*.28],[bl*sc*.22,-bw*sc*.28],[-bl*sc*.32,bw*sc*.1],[bl*sc*.22,bw*sc*.1]].forEach(([wx,wy])=>{
    ctx.beginPath();ctx.ellipse(wx,wy,bw*sc*.12,bw*sc*.07,0,0,Math.PI*2);ctx.fill();
  });
  // spoiler
  if(id>=2){ctx.fillStyle='#0a0a0a';ctx.fillRect(-bl*sc*.52,-bw*sc*.36,bl*sc*.08,bw*sc*.72);}
  // VOID glow
  if(id===5){
    ctx.shadowColor='#aa44ff';ctx.shadowBlur=18;
    ctx.strokeStyle=`rgba(170,68,255,${.7+Math.sin(t/400)*.25})`;ctx.lineWidth=2;
    ctx.strokeRect(-bl*sc/2,-bw*sc*.22,bl*sc,bw*sc*.44);ctx.shadowBlur=0;
  }
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════
// MAP PREVIEW CARDS
// ═══════════════════════════════════════════════════════════
function buildMapCards(){
  const wrap=document.getElementById('mcards');wrap.innerHTML='';
  MAPS.forEach((m,i)=>{
    const card=document.createElement('div');card.className='mcard'+(i===G.selMap?' s':'');
    card.onclick=()=>{G.selMap=i;document.querySelectorAll('.mcard').forEach((c,j)=>c.classList.toggle('s',j===i));};
    const cv=document.createElement('canvas');cv.width=270;cv.height=148;
    const ctx=cv.getContext('2d');
    // sky
    const sky=ctx.createLinearGradient(0,0,0,148);
    sky.addColorStop(0,'#'+m.sky.toString(16).padStart(6,'0'));sky.addColorStop(1,'#'+m.gnd.toString(16).padStart(6,'0'));
    ctx.fillStyle=sky;ctx.fillRect(0,0,270,148);
    // sun/glow
    const sg=ctx.createRadialGradient(220,30,0,220,30,80);
    sg.addColorStop(0,m.accent+'88');sg.addColorStop(1,'transparent');
    ctx.fillStyle=sg;ctx.fillRect(0,0,270,148);
    // road
    const rd=ctx.createLinearGradient(0,80,0,148);
    rd.addColorStop(0,'#'+m.road.toString(16).padStart(6,'0'));rd.addColorStop(1,'#'+m.gnd.toString(16).padStart(6,'0'));
    ctx.fillStyle=rd;ctx.beginPath();ctx.moveTo(80,80);ctx.lineTo(190,80);ctx.lineTo(270,148);ctx.lineTo(0,148);ctx.closePath();ctx.fill();
    // lane mark
    ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=2;ctx.setLineDash([12,10]);
    ctx.beginPath();ctx.moveTo(135,80);ctx.lineTo(135,148);ctx.stroke();ctx.setLineDash([]);
    // trees silhouette
    ctx.fillStyle='#0a1a08';
    for(let t=0;t<8;t++){const tx=t*35+10,th=40+Math.sin(t)*15;ctx.fillRect(tx,80-th,6,th);ctx.beginPath();ctx.arc(tx+3,80-th,8+Math.sin(t)*3,0,Math.PI*2);ctx.fill();}
    const mi=document.createElement('div');mi.className='mi';mi.appendChild(cv);
    const info=document.createElement('div');
    info.innerHTML=`<div class="mn">${m.name}</div><div class="mv">${m.vibe}</div><div class="mb">Best: ${(G.best[i].s||0).toLocaleString()}</div>`;
    card.appendChild(mi);card.appendChild(info);wrap.appendChild(card);
  });
}

// ═══════════════════════════════════════════════════════════
// UI
// ═══════════════════════════════════════════════════════════
function showNotif(msg){
  const el=document.getElementById('notif');el.textContent=msg;el.style.opacity='1';
  clearTimeout(showNotif._t);showNotif._t=setTimeout(()=>el.style.opacity='0',1500);
}

const UI={
  goMenu(){G.running=false;G.paused=false;this.set('sm');document.getElementById('hud').classList.remove('on');document.getElementById('menu-c').textContent=G.coins.toLocaleString();},
  goMap(){buildMapCards();this.set('smap');},
  goGar(){garId=G.selCar;this.set('sgar');document.getElementById('gar-c').textContent=G.coins.toLocaleString();buildCGr();showGCar(G.selCar);},
  goRec(){this.set('srec');for(let i=0;i<3;i++){document.getElementById('r'+i+'s').textContent=(G.best[i].s||0).toLocaleString();document.getElementById('r'+i+'d').textContent=(G.best[i].d||0).toLocaleString();document.getElementById('r'+i+'c').textContent=(G.best[i].c||0)+'x';}},
  startGame(){
    this.set(null);document.getElementById('hud').classList.add('on');
    resetSess();
    Trk.gen(G.selMap);buildScene(G.selMap);
    const sp=Trk.start();G.px=sp.x;G.pz=sp.z;G.heading=sp.h;
    G.speed=0;G.latV=0;G.grip=1;G.vx=0;G.vz=0;G.yawRate=0;G.rearGrip=1;G.spinout=false;G.tireWear=1;G.driftAngle=0;G.dScore=0;
    G.camSmX=G.px-Math.sin(G.heading)*8;G.camSmZ=G.pz-Math.cos(G.heading)*8;G.camSmY=2.5;
    camera.position.set(G.camSmX,G.camSmY,G.camSmZ);camera.lookAt(G.px,.5,G.pz);
    G.running=true;G.paused=false;G.t=0;G.frame=0;G.weatherT=0;
    G.ghPlay=G.ghosts[G.selMap];G.ghF=0;
    rivalInit();
    document.getElementById('hud-map').textContent=MAPS[G.selMap].name;
    if(Snd.ctx&&Snd.ctx.state==='suspended')Snd.ctx.resume();
    UI.updHUD();
  },
  pause(){G.paused=true;this.set('spause');},
  resume(){G.paused=false;this.set(null);},
  endSess(){
    G.running=false;G.paused=false;document.getElementById('hud').classList.remove('on');
    const mi=G.selMap;const nb=G.score>G.best[mi].s;
    if(nb)G.best[mi].s=G.score;if(G.bestDrift>G.best[mi].d)G.best[mi].d=G.bestDrift;if(G.bestCombo>G.best[mi].c)G.best[mi].c=G.bestCombo;
    G.coins+=G.coinsEarned;
    if(G.score>=(G.ghosts[mi]?.score||0))G.ghosts[mi]=G.ghRec.slice(0,2500);
    Sv.save();
    document.getElementById('ebnr').style.display=nb?'block':'none';
    const st=[['TOTAL SCORE',G.score.toLocaleString()],['BEST DRIFT',G.bestDrift.toLocaleString()],['BEST COMBO',G.bestCombo+'×'],['DRIFTS',G.driftCnt],['NEAR MISSES',G.nmCnt]];
    document.getElementById('egrid').innerHTML=st.map(([l,v])=>`<div style="color:rgba(255,255,255,.5)">${l}</div><div class="ev">${v}</div>`).join('');
    document.getElementById('ecoins').textContent=G.coinsEarned;
    const ss=G.score+G.bestCombo*50+G.nmCnt*20;let rtg=RATINGS[0];for(const r of RATINGS)if(ss>=r.min)rtg=r;
    const re=document.getElementById('ertg');re.textContent=rtg.g;re.style.color=rtg.g==='LEGEND'?'#ffd700':rtg.g.startsWith('S')?'#4db8ff':rtg.g==='A'?'#00ff88':'#fff';
    document.getElementById('erflv').textContent=rtg.t;
    this.set('send');
  },
  tryAgain(){this.startGame();},
  selCar(){G.selCar=garId;buildCGr();showGCar(garId);Sv.save();showNotif('Car selected!');},
  buyCar(){
    const def=CARS[garId];if(G.coins<def.price){showNotif('Not enough coins!');return;}
    G.coins-=def.price;G.unlocked.push(def.id);Sv.save();Snd.unlock();
    showGCar(def.id);buildCGr();document.getElementById('gar-c').textContent=G.coins.toLocaleString();showNotif('🎉 '+def.name+' unlocked!');
  },
  updHUD(){
    document.getElementById('hsc').textContent=G.score.toLocaleString();
    document.getElementById('hbd').textContent=G.bestDrift.toLocaleString();
    document.getElementById('hcc').textContent=G.coinsEarned;
  },
  set(id){document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));if(id)document.getElementById(id)?.classList.add('on');}
};

function resetSess(){
  G.score=0;G.bestDrift=0;G.bestCombo=0;G.driftCnt=0;G.nmCnt=0;G.coinsEarned=0;G.coinProg=0;
  G.drifting=false;G.dScore=0;G.dDur=0;G.combo=0;G.dEndT=0;G.ghRec=[];G.shake=0;
  document.getElementById('combo-disp').style.display='none';
  document.getElementById('drift-live').style.display='none';
  document.getElementById('spin-msg').style.display='none';
}

// ═══════════════════════════════════════════════════════════
// GARAGE GRID
// ═══════════════════════════════════════════════════════════
function buildCGr(){
  const g=document.getElementById('cgr');g.innerHTML='';
  CARS.forEach(def=>{
    const owned=G.unlocked.includes(def.id);
    const cell=document.createElement('div');
    cell.className='cc'+(def.id===garId?' on':'')+(owned?'':' lk');
    const cv=document.createElement('canvas');cv.width=76;cv.height=50;
    const ctx=cv.getContext('2d');drawGarCar(ctx,def.id,G.colors[def.id]||0,38,25,0);
    cell.appendChild(cv);
    const nm=document.createElement('div');nm.style.fontWeight='700';nm.textContent=def.name;cell.appendChild(nm);
    if(!owned){const pr=document.createElement('div');pr.style.cssText='font-size:10px;color:#ffd700';pr.textContent='🪙'+def.price.toLocaleString();cell.appendChild(pr);}
    else if(def.id===G.selCar){const a=document.createElement('div');a.style.cssText='font-size:9px;color:#4db8ff;letter-spacing:1px';a.textContent='ACTIVE';cell.appendChild(a);}
    cell.onclick=()=>showGCar(def.id);g.appendChild(cell);
  });
}
function showGCar(id){
  garId=id;document.querySelectorAll('.cc').forEach((c,i)=>c.classList.toggle('on',i===id));
  const def=CARS[id];const owned=G.unlocked.includes(id);
  document.getElementById('gcname').textContent=def.name;
  document.getElementById('gcdesc').textContent=def.desc;
  const sd=[{l:'TOP SPEED',v:def.topSpd/66},{l:'ACCELERATION',v:def.acc/1.38},{l:'DRIFT',v:(1-def.gR/.58)},{l:'HANDLING',v:def.steer/.074}];
  document.getElementById('gstats').innerHTML=sd.map(s=>`<div class="sr"><div class="sl">${s.l}</div><div class="sb"><div class="sf" style="width:${Math.min(100,s.v*100).toFixed(0)}%"></div></div></div>`).join('');
  const cp=document.getElementById('gcp');cp.innerHTML='';
  if(owned)CCOLORS.forEach((c,i)=>{const sw=document.createElement('div');sw.className='cs'+(i===(G.colors[id]||0)?' on':'');sw.style.background=c[0];sw.onclick=()=>{G.colors[id]=i;document.querySelectorAll('.cs').forEach((s,j)=>s.classList.toggle('on',j===i));Sv.save();buildCGr();startGarAnim(id);};cp.appendChild(sw);});
  const sb=document.getElementById('gsel'),bb=document.getElementById('gbuy');
  if(owned){sb.style.display='block';sb.textContent=id===G.selCar?'SELECTED':'SELECT';bb.style.display='none';}
  else{sb.style.display='none';bb.style.display='block';bb.textContent='BUY 🪙'+def.price.toLocaleString();bb.disabled=G.coins<def.price;bb.style.opacity=G.coins<def.price?'.4':'1';}
  startGarAnim(id);
}

// ═══════════════════════════════════════════════════════════
// MENU BACKGROUND SCENE
// ═══════════════════════════════════════════════════════════
function buildMenuScene(){
  scene=new THREE.Scene();scene.background=new THREE.Color(0x06090f);scene.fog=new THREE.FogExp2(0x06090f,.025);
  camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,500);
  camera.position.set(0,3.5,-10);camera.lookAt(0,1,0);
  const al=new THREE.AmbientLight(0x102030,.6);scene.add(al);
  const dl=new THREE.DirectionalLight(0x4080ff,2);dl.position.set(5,10,3);scene.add(dl);
  const fl=new THREE.DirectionalLight(0x2040a0,.5);fl.position.set(-5,5,-5);scene.add(fl);
  // floor
  const flrGeo=new THREE.PlaneGeometry(60,60,20,20);
  const flrMat=new THREE.MeshStandardMaterial({color:0x0a0e18,roughness:.8,metalness:.3,wireframe:false});
  const flr=new THREE.Mesh(flrGeo,flrMat);flr.rotation.x=-Math.PI/2;scene.add(flr);
  // grid lines
  const gridH=new THREE.GridHelper(60,30,0x1a2a4a,0x0e1830);scene.add(gridH);
  // showcase car
  const showcase=buildCar(G.selCar,G.colors[G.selCar]||0,false);
  scene.add(showcase);scene.userData.showcaseCar=showcase;
  // point lights for drama
  const pl1=new THREE.PointLight(0x0088ff,.8,15);pl1.position.set(-3,3,0);scene.add(pl1);
  const pl2=new THREE.PointLight(0xff4400,.5,12);pl2.position.set(3,2,1);scene.add(pl2);
  // animate
  let t=0;
  function menuLoop(){
    if(G.running)return;
    t+=.008;
    const car=scene.userData.showcaseCar;
    if(car){car.rotation.y=t;car.position.y=Math.sin(t*1.2)*.06;}
    pl1.position.x=Math.sin(t*.7)*4;pl2.position.x=Math.cos(t*.5)*4;
    renderer.render(scene,camera);
    requestAnimationFrame(menuLoop);
  }
  menuLoop();
}

// ═══════════════════════════════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════════════════════════════
let lastT=0;
function loop(ts){
  const dt=Math.min((ts-lastT)/1000,.05);lastT=ts;
  G.t+=dt;G.frame++;

  if(G.running&&!G.paused){
    physTick(dt);Sc.tick(dt);tickSmoke(dt);carMeshTick(dt);camTick(dt);
    if(G.selMap===0){G.weatherT=Math.min(1,G.t/90);rainTick(dt);}
    if(G.drifting&&G.frame%2===0)G.ghRec.push({x:G.px,z:G.pz,h:G.heading});
    hudTick();drawMM();
  }

  if(G.running)renderer.render(scene,camera);
  requestAnimationFrame(loop);
}

// INIT
// ═══════════════════════════════════════════════════════════
Sv.load();
initR();
buildMenuScene();
Snd.init();
requestAnimationFrame(loop);
</script>
