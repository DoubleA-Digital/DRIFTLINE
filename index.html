<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DRIFT/LINE</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Inter',sans-serif;color:#fff;width:100vw;height:100vh}
#c{display:block;position:absolute;top:0;left:0;width:100%;height:100%}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
.screen{position:absolute;top:0;left:0;width:100%;height:100%;display:none;pointer-events:all;flex-direction:column;align-items:center;justify-content:center}
.screen.active{display:flex}
/* MENU */
#s-menu{background:linear-gradient(135deg,rgba(0,0,0,0.7),rgba(0,5,20,0.85))}
.logo{font-family:'Rajdhani',sans-serif;font-size:clamp(60px,10vw,110px);font-weight:700;letter-spacing:-2px;line-height:1;text-align:center}
.logo .d{color:#fff}.logo .sl{color:#00cfff}.logo .l{color:#fff}
.logo-sub{font-family:'Rajdhani',sans-serif;font-size:14px;letter-spacing:6px;color:rgba(255,255,255,0.4);margin-top:4px;text-align:center}
.mbtn{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:600;letter-spacing:4px;padding:14px 52px;border:2px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.04);color:#fff;cursor:pointer;transition:all .18s;text-transform:uppercase;display:block;width:240px;text-align:center}
.mbtn:hover,.mbtn.sel{border-color:#00cfff;color:#00cfff;background:rgba(0,207,255,0.1);transform:translateX(6px)}
.mbtn.pri{border-color:#00cfff;background:rgba(0,207,255,0.12);color:#00cfff}
.mbtn.pri:hover{background:rgba(0,207,255,0.25)}
.coins-hdr{position:absolute;top:22px;right:28px;display:flex;align-items:center;gap:8px;font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:700}
.ci{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe066,#c87800);box-shadow:0 0 10px #ffcc0066}
/* MAP SELECT */
#s-map{background:rgba(0,0,0,0.82);gap:36px}
.mcards{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.mcard{width:260px;border:2px solid rgba(255,255,255,0.12);background:rgba(10,10,30,0.8);cursor:pointer;transition:all .2s;overflow:hidden}
.mcard:hover,.mcard.sel{border-color:#00cfff;transform:translateY(-6px);box-shadow:0 12px 40px rgba(0,207,255,0.2)}
.mcard-img{width:100%;height:140px;position:relative;overflow:hidden}
.mcard-info{padding:14px}
.mcard-name{font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700}
.mcard-vibe{font-size:11px;color:rgba(255,255,255,0.5);margin-top:3px}
.mcard-best{font-size:12px;color:#ffd700;margin-top:6px}
/* GARAGE */
#s-garage{background:rgba(0,0,0,0.88);overflow-y:auto;padding:24px;gap:0}
.g-wrap{display:flex;gap:32px;width:100%;max-width:1100px;margin-top:12px}
.g-left{width:340px;flex-shrink:0;display:flex;flex-direction:column;gap:16px}
.g-preview{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px}
#g-canvas{border:1px solid rgba(255,255,255,0.06);background:#060610}
.statrow{display:flex;align-items:center;gap:10px;font-size:12px;width:100%}
.statlabel{width:96px;font-family:'Rajdhani',sans-serif;font-size:13px;color:rgba(255,255,255,0.6)}
.statbg{flex:1;height:5px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden}
.statfill{height:100%;border-radius:3px;background:linear-gradient(90deg,#00cfff,#7c3aed);transition:width .5s ease}
.cpick{display:flex;gap:7px;margin-top:4px}
.csw{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .2s}
.csw:hover,.csw.on{border-color:#fff;transform:scale(1.25)}
.g-right{flex:1;display:flex;flex-direction:column;gap:12px}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ccell{border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.02);padding:10px;cursor:pointer;transition:all .18s;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:'Rajdhani',sans-serif;font-size:12px}
.ccell:hover{border-color:rgba(255,255,255,0.35)}.ccell.on{border-color:#00cfff;background:rgba(0,207,255,0.08)}
.ccell.lk{opacity:0.55}
/* HUD */
#hud{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;display:none}
#hud.on{display:block}
#h-total{position:absolute;top:18px;right:56px;font-family:'Rajdhani',sans-serif;font-size:30px;font-weight:700;text-align:right;line-height:1.1}
#h-total span{display:block;font-size:11px;color:rgba(255,255,255,0.4);letter-spacing:2px}
#h-best{position:absolute;top:72px;right:56px;font-family:'Rajdhani',sans-serif;font-size:16px;color:#ffd700}
#h-combo{position:absolute;top:50%;right:44px;transform:translateY(-50%);font-family:'Rajdhani',sans-serif;font-size:80px;font-weight:700;color:#00cfff;text-shadow:0 0 24px #00cfff88;display:none;transition:transform .1s}
#h-map{position:absolute;top:18px;left:18px;font-family:'Rajdhani',sans-serif;font-size:14px;color:rgba(255,255,255,0.5);letter-spacing:2px}
#h-gear{position:absolute;bottom:28px;left:200px;font-family:'Rajdhani',sans-serif;font-size:48px;font-weight:700;color:#fff;text-shadow:0 0 20px #00cfff66}
#h-spin{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);font-family:'Rajdhani',sans-serif;font-size:72px;font-weight:700;color:#ff3333;text-shadow:0 0 40px #ff3333;display:none;pointer-events:none;letter-spacing:4px}
#h-drift{position:absolute;bottom:160px;left:50%;transform:translateX(-50%);font-family:'Rajdhani',sans-serif;font-size:28px;font-weight:700;color:#ffcc00;text-shadow:0 0 16px #ffaa00;display:none;text-align:center}
#h-mute{position:absolute;top:18px;right:18px;font-size:20px;cursor:pointer;pointer-events:all;opacity:0.6}
#h-mute:hover{opacity:1}
#h-coins-bar{position:absolute;top:104px;right:56px;width:120px}
#h-coins-bar label{font-size:10px;color:rgba(255,255,255,0.4);display:flex;justify-content:space-between}
#h-cprog{height:3px;background:rgba(255,255,255,0.1);margin-top:2px;border-radius:2px}
#h-cpfill{height:100%;background:#ffd700;border-radius:2px;width:0%;transition:width .3s}
canvas#speedo{position:absolute;bottom:20px;left:18px}
canvas#driftarc{position:absolute;bottom:20px;left:155px}
canvas#mmap{position:absolute;bottom:20px;right:18px;border:1px solid rgba(255,255,255,0.15)}
#h-near{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);font-family:'Rajdhani',sans-serif;font-size:22px;color:#ff8800;display:none;pointer-events:none}
/* PAUSE */
#s-pause{background:rgba(0,0,0,0.6);backdrop-filter:blur(10px)}
/* END */
#s-end{background:rgba(0,0,0,0.88);gap:14px}
.end-title{font-family:'Rajdhani',sans-serif;font-size:52px;font-weight:700;letter-spacing:4px}
.end-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 48px;font-size:15px;margin:10px 0}
.ev{font-family:'Rajdhani',sans-serif;font-size:28px;font-weight:700;color:#00cfff}
.rating-box{text-align:center}
.rtg{font-family:'Rajdhani',sans-serif;font-size:90px;font-weight:700;line-height:1}
.rflavor{font-size:14px;color:rgba(255,255,255,0.5);font-style:italic;margin-top:4px}
.best-banner{font-family:'Rajdhani',sans-serif;font-size:28px;color:#ffd700;text-shadow:0 0 20px #ffd70088;animation:pls .5s infinite alternate;display:none}
@keyframes pls{from{opacity:1}to{opacity:.5}}
.end-btns{display:flex;gap:10px;margin-top:10px}
/* NOTIF */
#notif{position:absolute;top:170px;left:50%;transform:translateX(-50%);font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:600;pointer-events:none;text-align:center;opacity:0;transition:opacity .3s;color:#00cfff;letter-spacing:2px;text-shadow:0 0 20px currentColor}
/* SECTION HDR */
.shdr{font-family:'Rajdhani',sans-serif;font-size:44px;font-weight:700;letter-spacing:4px;margin-bottom:4px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">

<!-- MENU -->
<div id="s-menu" class="screen active">
  <div class="coins-hdr"><div class="ci"></div><span id="menu-coins">0</span></div>
  <div class="logo"><span class="d">DRIFT</span><span class="sl">/</span><span class="l">LINE</span></div>
  <div class="logo-sub">MASTERS EDITION</div>
  <div style="display:flex;flex-direction:column;gap:10px;margin-top:40px">
    <button class="mbtn pri" onclick="UI.goMap()">DRIVE</button>
    <button class="mbtn" onclick="UI.goGarage()">GARAGE</button>
    <button class="mbtn" onclick="UI.goRecords()">RECORDS</button>
  </div>
</div>

<!-- MAP SELECT -->
<div id="s-map" class="screen">
  <div class="shdr">SELECT TRACK</div>
  <div class="mcards" id="mcards"></div>
  <div style="display:flex;gap:10px">
    <button class="mbtn" onclick="UI.goMenu()">BACK</button>
    <button class="mbtn pri" onclick="UI.startGame()">RACE</button>
  </div>
</div>

<!-- GARAGE -->
<div id="s-garage" class="screen">
  <div class="coins-hdr" style="position:relative;align-self:flex-end;margin-bottom:0"><div class="ci"></div><span id="g-coins">0</span></div>
  <div class="shdr">GARAGE</div>
  <div class="g-wrap">
    <div class="g-left">
      <div class="g-preview">
        <canvas id="g-canvas" width="300" height="200"></canvas>
        <div style="font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700" id="g-cname">—</div>
        <div style="font-size:12px;color:rgba(255,255,255,0.4);text-align:center;margin-top:-4px" id="g-cdesc">—</div>
        <div class="cpick" id="g-cpick"></div>
        <div id="g-stats" style="width:100%;display:flex;flex-direction:column;gap:7px"></div>
        <div style="display:flex;gap:8px;margin-top:6px">
          <button class="mbtn pri" id="g-selbtn" onclick="UI.selCar()" style="padding:10px 28px;font-size:16px">SELECT</button>
          <button class="mbtn" id="g-buybtn" onclick="UI.buyCar()" style="display:none;padding:10px 28px;font-size:16px">BUY</button>
        </div>
      </div>
    </div>
    <div class="g-right">
      <div class="cgrid" id="cgrid"></div>
    </div>
  </div>
  <button class="mbtn" onclick="UI.goMenu()" style="margin-top:16px">BACK</button>
</div>

<!-- RECORDS -->
<div id="s-records" class="screen" style="gap:20px">
  <div class="shdr">RECORDS</div>
  <table style="border-collapse:collapse;width:540px">
    <tr><th style="font-family:Rajdhani;letter-spacing:2px;font-size:13px;padding:8px 16px;border-bottom:1px solid rgba(255,255,255,0.15);text-align:left;color:rgba(255,255,255,0.5)">TRACK</th><th style="font-family:Rajdhani;letter-spacing:2px;font-size:13px;padding:8px 16px;border-bottom:1px solid rgba(255,255,255,0.15);text-align:left;color:rgba(255,255,255,0.5)">SCORE</th><th style="font-family:Rajdhani;letter-spacing:2px;font-size:13px;padding:8px 16px;border-bottom:1px solid rgba(255,255,255,0.15);text-align:left;color:rgba(255,255,255,0.5)">BEST DRIFT</th><th style="font-family:Rajdhani;letter-spacing:2px;font-size:13px;padding:8px 16px;border-bottom:1px solid rgba(255,255,255,0.15);text-align:left;color:rgba(255,255,255,0.5)">COMBO</th></tr>
    <tr><td style="padding:10px 16px;font-family:Rajdhani;font-size:17px">Harbor Night</td><td id="r0s" style="padding:10px 16px;font-family:Rajdhani;font-size:17px;color:#00cfff">0</td><td id="r0d" style="padding:10px 16px;font-family:Rajdhani;font-size:17px;color:#00cfff">0</td><td id="r0c" style="padding:10px 16px;font-family:Rajdhani;font-size:17px;color:#00cfff">0x</td></tr>
    <tr><td style="padding:10px 16px;font-family:Rajdhani;font-size:17px">Canyon Dawn</td><td id="r1s" style="padding:10px 16px;font-family:Rajdhani;font-size:17px;color:#00cfff">0</td><td id="r1d" style="padding:10px 16px;font-family:Rajdhani;font-size:17px;color:#00cfff">0</td><td id="r1c" style="padding:10px 16px;font-family:Rajdhani;font-size:17px;color:#00cfff">0x</td></tr>
    <tr><td style="padding:10px 16px;font-family:Rajdhani;font-size:17px">Neon Circuit</td><td id="r2s" style="padding:10px 16px;font-family:Rajdhani;font-size:17px;color:#00cfff">0</td><td id="r2d" style="padding:10px 16px;font-family:Rajdhani;font-size:17px;color:#00cfff">0</td><td id="r2c" style="padding:10px 16px;font-family:Rajdhani;font-size:17px;color:#00cfff">0x</td></tr>
  </table>
  <button class="mbtn" onclick="UI.goMenu()">BACK</button>
</div>

<!-- PAUSE -->
<div id="s-pause" class="screen">
  <div style="font-family:'Rajdhani',sans-serif;font-size:56px;font-weight:700;letter-spacing:5px;margin-bottom:28px">PAUSED</div>
  <div style="display:flex;flex-direction:column;gap:10px">
    <button class="mbtn pri" onclick="UI.resume()">RESUME</button>
    <button class="mbtn" id="vol-btn" onclick="Audio.toggle()">SOUND: ON</button>
    <button class="mbtn" onclick="UI.endSession()">QUIT SESSION</button>
    <button class="mbtn" onclick="UI.goMenu()">MAIN MENU</button>
  </div>
</div>

<!-- SESSION END -->
<div id="s-end" class="screen">
  <div class="end-title">SESSION COMPLETE</div>
  <div class="best-banner" id="e-best">★ NEW PERSONAL BEST ★</div>
  <div style="display:flex;gap:60px;align-items:flex-start">
    <div class="end-grid" id="e-grid"></div>
    <div class="rating-box">
      <div style="font-size:11px;letter-spacing:3px;color:rgba(255,255,255,0.4)">STYLE</div>
      <div class="rtg" id="e-rtg">B</div>
      <div class="rflavor" id="e-flv">Not bad.</div>
    </div>
  </div>
  <div style="font-family:'Rajdhani',sans-serif;font-size:22px;display:flex;align-items:center;gap:10px">
    <div class="ci" style="width:26px;height:26px"></div>+<span id="e-coins">0</span> COINS
  </div>
  <div class="end-btns">
    <button class="mbtn pri" onclick="UI.tryAgain()">TRY AGAIN</button>
    <button class="mbtn" onclick="UI.goGarage()">GARAGE</button>
    <button class="mbtn" onclick="UI.goMenu()">MENU</button>
  </div>
</div>

<!-- HUD -->
<div id="hud">
  <div id="h-map"></div>
  <div id="h-total"><span>SESSION</span><span id="h-score">0</span></div>
  <div id="h-best">BEST: <span id="h-bestv">0</span></div>
  <div id="h-coins-bar"><label><span>🪙</span><span id="h-ccnt">0</span></label><div id="h-cprog"><div id="h-cpfill"></div></div></div>
  <div id="h-combo"></div>
  <div id="h-spin">SPIN OUT!</div>
  <div id="h-drift"></div>
  <div id="h-gear">1</div>
  <div id="h-near">NEAR MISS!</div>
  <canvas id="speedo" width="130" height="130"></canvas>
  <canvas id="driftarc" width="90" height="90"></canvas>
  <canvas id="mmap" width="160" height="160"></canvas>
  <div id="h-mute" onclick="Audio.toggle()">🔊</div>
</div>

<div id="notif"></div>
</div>
<script>
// ── CONSTANTS ──────────────────────────────────────────────
const CARS = [
  {id:0,name:'Civic Wreck',price:0,
   topSpeed:22,accel:.55,brake:.9,steer:.048,gripF:.92,gripR:.58,driftK:.62,mass:1200,
   tone:110,trail:'#aaaaaa',trailGlow:false,
   desc:'Understeer-heavy. Forgiving. Learn here.'},
  {id:1,name:'Sunset 240',price:800,
   topSpeed:30,accel:.72,brake:.85,steer:.055,gripF:.88,gripR:.50,driftK:.70,mass:1050,
   tone:145,trail:'#aaddff',trailGlow:false,
   desc:'Balanced oversteer. This is where it clicks.'},
  {id:2,name:'Ghost RS',price:2500,
   topSpeed:36,accel:.88,brake:.82,steer:.062,gripF:.85,gripR:.44,driftK:.78,mass:980,
   tone:185,trail:'#ffffff',trailGlow:false,
   desc:'Snappy entry. Holds angle. Rewards precision.'},
  {id:3,name:'Ryū GT',price:6000,
   topSpeed:44,accel:.95,brake:.78,steer:.058,gripF:.82,gripR:.38,driftK:.84,mass:1080,
   tone:95,trail:'#ffdd44',trailGlow:false,
   desc:'Fast and loose. Commit or spin.'},
  {id:4,name:'Phantom S',price:15000,
   topSpeed:54,accel:1.1,brake:.75,steer:.068,gripF:.80,gripR:.34,driftK:.88,mass:960,
   tone:220,trail:'#44aaff',trailGlow:false,
   desc:'Explosive. Every input is critical.'},
  {id:5,name:'VOID-R',price:40000,
   topSpeed:64,accel:1.35,brake:.70,steer:.075,gripF:.78,gripR:.28,driftK:.94,mass:900,
   tone:60,trail:'#aa44ff',trailGlow:true,
   desc:'Godlike. Infinite drift potential.'}
];
const CAR_COLORS=[
  ['#e0e0e0','#b0b0b0'],['#cc2222','#991111'],['#1a6bb5','#0d4a80'],
  ['#1a1a1a','#111111'],['#e0a020','#b07010'],['#22aa44','#158830']
];
const MAPS=[
  {id:0,name:'HARBOR NIGHT',accent:'#00cfff',fog:0x050a14,fogDensity:.018,sky:0x060c1a,
   groundColor:0x0a0f1a,wallColor:0x1a3050,trackColor:0x0f1520,lineColor:0x1a3a5a,
   ambient:0x102030,sun:0x3060a0,vibe:'Rainy port city · 2AM · Neon reflections'},
  {id:1,name:'CANYON DAWN',accent:'#ff9f43',fog:0x1a0800,fogDensity:.014,sky:0x2a0e00,
   groundColor:0x3d1a00,wallColor:0x8b3a0a,trackColor:0x888070,lineColor:0xccaa66,
   ambient:0x441808,sun:0xff6600,vibe:'Desert canyon · Sunrise · Dust clouds'},
  {id:2,name:'NEON CIRCUIT',accent:'#7c3aed',fog:0x010108,fogDensity:.022,sky:0x020210,
   groundColor:0x020210,wallColor:0x3d1a6e,trackColor:0x0a0a18,lineColor:0x7c3aed,
   ambient:0x0a0020,sun:0x8844ff,vibe:'Underground circuit · Crowds · Holographic'}
];
const RATINGS=[
  {min:0,g:'F',t:"What was that?"},
  {min:100,g:'D',t:"Keep trying."},
  {min:300,g:'C',t:"Getting there."},
  {min:700,g:'B',t:"Not bad."},
  {min:1500,g:'A',t:"Nice driving."},
  {min:3000,g:'S',t:"That was smooth."},
  {min:6000,g:'S+',t:"Are you even human?"},
  {min:12000,g:'LEGEND',t:"They call you the Ghost."}
];

// ── STATE ───────────────────────────────────────────────────
const GS={
  coins:0,unlocked:[0],colors:{},selCar:0,selMap:0,
  best:[{s:0,d:0,c:0},{s:0,d:0,c:0},{s:0,d:0,c:0}],
  ghosts:[null,null,null],
  running:false,paused:false,
  score:0,bestDrift:0,bestCombo:0,driftCount:0,nearMisses:0,coinsEarned:0,
  coinProg:0,
  // physics
  px:0,py:0,pz:0,
  vx:0,vz:0,
  heading:0,
  speed:0,
  steerAngle:0,
  latVel:0,
  grip:1,
  handbrake:false,
  spinout:false,spinTimer:0,
  tireWear:1,
  driftAngle:0,
  rpm:0,gear:1,
  // drift score
  drifting:false,driftScore:0,driftDur:0,driftMult:1,
  driftEndTime:0,combo:0,
  // camera
  camDist:12,camHeight:5,camYaw:0,
  shakeAmt:0,
  // time
  t:0,frame:0,
  weatherT:0,
  ghRec:[],ghPlay:null,ghFrame:0,
  rival:null,
  particles:[],trails:[],floats:[],
};

// ── PERSISTENCE ─────────────────────────────────────────────
const Save={
  load(){
    try{
      const d=JSON.parse(localStorage.getItem('dl3')||'{}');
      GS.coins=d.coins||0;
      GS.unlocked=d.unlocked||[0];
      GS.colors=d.colors||{};
      GS.selCar=d.selCar||0;
      GS.best=d.best||GS.best;
      GS.ghosts=d.ghosts||[null,null,null];
    }catch(e){}
  },
  save(){
    try{
      localStorage.setItem('dl3',JSON.stringify({
        coins:GS.coins,unlocked:GS.unlocked,colors:GS.colors,
        selCar:GS.selCar,best:GS.best,
        ghosts:GS.ghosts.map(g=>g?g.slice(0,3000):null)
      }));
    }catch(e){}
  }
};

// ── INPUT ───────────────────────────────────────────────────
const Keys={};
window.addEventListener('keydown',e=>{
  Keys[e.code]=true;

// ── AUDIO ───────────────────────────────────────────────────
const Audio={
  ctx:null,master:null,eng:null,engG:null,sq:null,sqG:null,sqF:null,muted:false,
  init(){
    try{
      this.ctx=new(window.AudioContext||window.webkitAudioContext)();
      this.master=this.ctx.createGain(); this.master.gain.value=.7;
      this.master.connect(this.ctx.destination);
      // engine
      this.eng=this.ctx.createOscillator(); this.eng.type='sawtooth';
      this.engG=this.ctx.createGain(); this.engG.gain.value=0;
      const ws=this.ctx.createWaveShaper();
      const c=new Float32Array(256);for(let i=0;i<256;i++){const x=i*2/256-1;c[i]=x*.7;}
      ws.curve=c;
      this.eng.connect(ws);ws.connect(this.engG);this.engG.connect(this.master);
      this.eng.start();
      // squeal
      const bsz=this.ctx.sampleRate*2;
      const nb=this.ctx.createBuffer(1,bsz,this.ctx.sampleRate);
      const nd=nb.getChannelData(0);for(let i=0;i<bsz;i++)nd[i]=Math.random()*2-1;
      this.sqF=this.ctx.createBiquadFilter();this.sqF.type='bandpass';
      this.sqF.frequency.value=900;this.sqF.Q.value=4;
      this.sqG=this.ctx.createGain();this.sqG.gain.value=0;
      const ns=this.ctx.createBufferSource();ns.buffer=nb;ns.loop=true;
      ns.connect(this.sqF);this.sqF.connect(this.sqG);this.sqG.connect(this.master);
      ns.start();
    }catch(e){}
  },
  tick(speed,maxSpeed,driftAng){
    if(!this.ctx||this.muted)return;
    if(this.ctx.state==='suspended')this.ctx.resume();
    const r=speed/maxSpeed;
    const car=CARS[GS.selCar];
    this.eng.frequency.setTargetAtTime(car.tone+r*car.tone*3+(GS.handbrake?50:0),this.ctx.currentTime,.08);
    this.engG.gain.setTargetAtTime(GS.running&&!GS.paused?.07+r*.1:0,this.ctx.currentTime,.1);
    const sv=driftAng>15?Math.min(.18,(driftAng-15)/60*.18):0;
    this.sqG.gain.setTargetAtTime(sv,this.ctx.currentTime,.04);
    if(this.sqF)this.sqF.frequency.setTargetAtTime(700+driftAng*9,this.ctx.currentTime,.05);
  },
  beep(freq,vol,dur,type='sine'){
    if(!this.ctx||this.muted)return;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(vol,this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+dur);
    o.connect(g);g.connect(this.master);o.start();o.stop(this.ctx.currentTime+dur+.01);
  },
  coin(){[523,659,784].forEach((f,i)=>setTimeout(()=>this.beep(f,.12,.2),i*80));},
  unlock(){[261,329,392,523,659,784].forEach((f,i)=>setTimeout(()=>this.beep(f,.15,.25,'triangle'),i*90));},
  combo(n){const f=n>=20?[523,659,784,1047]:n>=10?[392,523,659]:[329,415];f.forEach((x,i)=>setTimeout(()=>this.beep(x,.08,.15,'square'),i*55));},
  hit(v){this.beep(80+v*50,.25,.3,'sawtooth');},
  toggle(){
    this.muted=!this.muted;
    if(this.master)this.master.gain.value=this.muted?0:.7;
    document.getElementById('h-mute').textContent=this.muted?'🔇':'🔊';
    document.getElementById('vol-btn').textContent=this.muted?'SOUND: OFF':'SOUND: ON';
  }
};

// ── TRACK ───────────────────────────────────────────────────
const Track={
  pts:[],wl:[],wr:[],barriers:[],HALF:14,
  gen(mapId){
    this.pts=[];this.wl=[];this.wr=[];this.barriers=[];
    const H=this.HALF;
    // control points per map
    const shapes=[
      // Harbor: wide sweeping
      [{x:-600,z:-300},{x:-200,z:-700},{x:400,z:-600},{x:800,z:-200},
       {x:700,z:400},{x:200,z:700},{x:-300,z:600},{x:-700,z:200},{x:-900,z:-100}],
      // Canyon: tight hairpins
      [{x:-700,z:-400},{x:-100,z:-800},{x:500,z:-500},{x:600,z:100},
       {x:100,z:500},{x:-200,z:700},{x:-600,z:400},{x:-800,z:0}],
      // Neon: technical squares
      [{x:-700,z:-500},{x:-100,z:-600},{x:600,z:-400},{x:700,z:200},
       {x:300,z:700},{x:-200,z:600},{x:-700,z:200},{x:-900,z:-100}]
    ][mapId]||[];
    const n=shapes.length,N=600;
    for(let i=0;i<N;i++){
      const t=i/N*n,i0=Math.floor(t),f=t-i0;
      const p0=shapes[(i0-1+n)%n],p1=shapes[i0%n],p2=shapes[(i0+1)%n],p3=shapes[(i0+2)%n];
      const x=.5*((2*p1.x)+(-p0.x+p2.x)*f+(2*p0.x-5*p1.x+4*p2.x-p3.x)*f*f+(-p0.x+3*p1.x-3*p2.x+p3.x)*f*f*f);
      const z=.5*((2*p1.z)+(-p0.z+p2.z)*f+(2*p0.z-5*p1.z+4*p2.z-p3.z)*f*f+(-p0.z+3*p1.z-3*p2.z+p3.z)*f*f*f);
      this.pts.push({x,y:0,z});
    }
    for(let i=0;i<this.pts.length;i++){
      const a=this.pts[i],b=this.pts[(i+1)%this.pts.length];
      const dx=b.x-a.x,dz=b.z-a.z,len=Math.sqrt(dx*dx+dz*dz)||1;
      const nx=-dz/len,nz=dx/len;
      this.wl.push({x:a.x+nx*H,y:0,z:a.z+nz*H});
      this.wr.push({x:a.x-nx*H,y:0,z:a.z-nz*H});
    }
  },
  nearest(x,z){
    let best=0,bd=Infinity;
    for(let i=0;i<this.pts.length;i+=4){
      const p=this.pts[i],d=(p.x-x)**2+(p.z-z)**2;
      if(d<bd){bd=d;best=i;}
    }
    return best;
  },
  wallDist(x,z){
    const ni=this.nearest(x,z);
    const wl=this.wl[ni],wr=this.wr[ni];
    const dl=Math.sqrt((wl.x-x)**2+(wl.z-z)**2);
    const dr=Math.sqrt((wr.x-x)**2+(wr.z-z)**2);
    return Math.min(dl,dr);
  },
  progress(x,z){return this.nearest(x,z)/this.pts.length;},
  startPos(){
    const p=this.pts[0],p2=this.pts[2];
    return{x:p.x,z:p.z,heading:Math.atan2(p2.x-p.x,p2.z-p.z)};
  }
};

// ── THREE.JS SCENE ──────────────────────────────────────────
let scene,camera,renderer,carMesh,carBody,carWheels=[],
    trackMesh,wallMeshes=[],groundMesh,envGroup,
    smokeParts=[],trailMeshes=[],rivalMesh,ghostMesh;

function initThree(){
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,3000);
  renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  window.addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
}

function buildScene(mapId){
  // clear
  while(scene.children.length>0)scene.remove(scene.children[0]);
  smokeParts=[];trailMeshes=[];wallMeshes=[];
  const M=MAPS[mapId];
  scene.background=new THREE.Color(M.sky);
  scene.fog=new THREE.FogExp2(M.fog,M.fogDensity);

  // ambient + directional
  scene.add(new THREE.AmbientLight(M.ambient,.8));
  const sun=new THREE.DirectionalLight(M.sun,1.4);
  sun.position.set(200,300,100);
  sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.near=1;sun.shadow.camera.far=1500;
  sun.shadow.camera.left=-600;sun.shadow.camera.right=600;
  sun.shadow.camera.top=600;sun.shadow.camera.bottom=-600;
  scene.add(sun);

  // ground plane
  const gGeo=new THREE.PlaneGeometry(4000,4000);
  const gMat=new THREE.MeshLambertMaterial({color:M.groundColor});
  groundMesh=new THREE.Mesh(gGeo,gMat);
  groundMesh.rotation.x=-Math.PI/2;groundMesh.receiveShadow=true;
  scene.add(groundMesh);

  // track surface
  buildTrackMesh(mapId);

  // walls + barriers
  buildWalls(mapId);

  // environment decorations
  buildEnv(mapId);

  // car
  buildCarMesh(GS.selCar,GS.colors[GS.selCar]||0);

  // ghost mesh
  ghostMesh=makeCarMeshRaw(GS.selCar,0,true);
  ghostMesh.visible=false;
  scene.add(ghostMesh);

  // rival mesh
  if(GS.unlocked.includes(2)){
    rivalMesh=makeCarMeshRaw(1,0,false);
    rivalMesh.visible=true;
    scene.add(rivalMesh);
  }

  // map-specific extras
  if(mapId===0)addHarborExtras();
  else if(mapId===1)addCanyonExtras();
  else addNeonExtras();
}

function buildTrackMesh(mapId){
  const pts=Track.pts,wl=Track.wl,wr=Track.wr,n=pts.length;
  const verts=[],uvs=[],inds=[];
  for(let i=0;i<n;i++){
    const l=wl[i],r=wr[i];
    verts.push(l.x,.01,l.z,r.x,.01,r.z);
    uvs.push(0,i/n, 1,i/n);
  }
  for(let i=0;i<n-1;i++){
    const a=i*2,b=a+1,c=a+2,d=a+3;
    inds.push(a,b,c,b,d,c);
  }
  // close
  const a=(n-1)*2,b=a+1;
  inds.push(a,b,0,b,1,0);
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
  geo.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
  geo.setIndex(inds);geo.computeVertexNormals();
  const M=MAPS[mapId];
  const mat=new THREE.MeshLambertMaterial({color:M.trackColor,side:THREE.DoubleSide});
  trackMesh=new THREE.Mesh(geo,mat);
  trackMesh.receiveShadow=true;
  scene.add(trackMesh);

  // center dashes
  const dashMat=new THREE.MeshBasicMaterial({color:M.lineColor});
  for(let i=0;i<n;i+=12){
    const p=Track.pts[i];
    const p2=Track.pts[(i+2)%n];
    const dx=p2.x-p.x,dz=p2.z-p.z;
    const len=Math.sqrt(dx*dx+dz*dz);
    const dash=new THREE.Mesh(new THREE.PlaneGeometry(len*.8,.35),dashMat);
    dash.position.set(p.x+(dx*.5),.02,p.z+(dz*.5));
    dash.rotation.x=-Math.PI/2;
    dash.rotation.z=-Math.atan2(dx,dz);
    scene.add(dash);
  }
}

function buildWalls(mapId){
  const M=MAPS[mapId];
  const wMat=new THREE.MeshLambertMaterial({color:M.wallColor});
  const n=Track.pts.length;
  for(let side=0;side<2;side++){
    const wall=side===0?Track.wl:Track.wr;
    for(let i=0;i<n;i++){
      const a=wall[i],b=wall[(i+1)%n];
      const dx=b.x-a.x,dz=b.z-a.z;
      const len=Math.sqrt(dx*dx+dz*dz);
      if(len<.1)continue;
      const geo=new THREE.BoxGeometry(len,.8,.4);
      const m=new THREE.Mesh(geo,wMat);
      m.position.set((a.x+b.x)/2,.4,(a.z+b.z)/2);
      m.rotation.y=-Math.atan2(dx,dz);
      m.castShadow=true;m.receiveShadow=true;
      scene.add(m);wallMeshes.push(m);
      // tall barrier every 20 segments
      if(i%20===0){
        const tall=new THREE.Mesh(new THREE.BoxGeometry(1.2,2.5,1.2),wMat);
        tall.position.set(a.x,.85,a.z);
        tall.castShadow=true;scene.add(tall);
      }
    }
  }
}

function buildEnv(mapId){
  envGroup=new THREE.Group();scene.add(envGroup);
  const rng=(min,max)=>min+Math.random()*(max-min);
  if(mapId===0){
    // containers
    const colors=[0xcc3300,0xffaa00,0x1144aa,0x225522];
    for(let i=0;i<60;i++){
      const c=new THREE.Mesh(new THREE.BoxGeometry(6+rng(0,4),3+rng(0,2),2.5),
        new THREE.MeshLambertMaterial({color:colors[i%4]}));
      const ang=rng(0,Math.PI*2),r=rng(180,350);
      c.position.set(Math.cos(ang)*r,c.geometry.parameters.height/2,Math.sin(ang)*r);
      c.castShadow=true;envGroup.add(c);
    }
    // streetlights
    for(let i=0;i<Track.pts.length;i+=30){
      const p=Track.pts[i];
      const pole=new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,7),
        new THREE.MeshLambertMaterial({color:0x888888}));
      pole.position.set(p.x,3.5,p.z);
      const light=new THREE.PointLight(0xff8844,.8,25);
      light.position.set(p.x,7,p.z);
      envGroup.add(pole,light);
    }
  } else if(mapId===1){
    // canyon walls
    const rockMat=new THREE.MeshLambertMaterial({color:0x8b3a0a});
    for(let i=0;i<40;i++){
      const ang=rng(0,Math.PI*2),r=rng(160,320);
      const h=rng(20,60);
      const rock=new THREE.Mesh(new THREE.CylinderGeometry(rng(8,20),rng(15,30),h,6),rockMat);
      rock.position.set(Math.cos(ang)*r,h/2,Math.sin(ang)*r);
      rock.rotation.y=rng(0,Math.PI);rock.castShadow=true;envGroup.add(rock);
    }
    // sun sphere
    const sunSph=new THREE.Mesh(new THREE.SphereGeometry(20,16,8),
      new THREE.MeshBasicMaterial({color:0xffe066}));
    sunSph.position.set(400,200,300);envGroup.add(sunSph);
    // cacti
    for(let i=0;i<30;i++){
      const ang=rng(0,Math.PI*2),r=rng(100,200);
      const body=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,4),
        new THREE.MeshLambertMaterial({color:0x2d5a27}));
      body.position.set(Math.cos(ang)*r,2,Math.sin(ang)*r);
      body.castShadow=true;envGroup.add(body);
    }
  } else {
    // buildings
    const bColors=[0x1a0a30,0x0a1a30,0x200a20];
    for(let i=0;i<50;i++){
      const ang=rng(0,Math.PI*2),r=rng(150,400);
      const h=rng(40,120);
      const bld=new THREE.Mesh(new THREE.BoxGeometry(rng(10,25),h,rng(10,25)),
        new THREE.MeshLambertMaterial({color:bColors[i%3]}));
      bld.position.set(Math.cos(ang)*r,h/2,Math.sin(ang)*r);
      bld.castShadow=true;envGroup.add(bld);
      // neon accent light
      if(i%5===0){
        const nl=new THREE.PointLight([0x7c3aed,0x06b6d4,0xff0044][i%3],.6,60);
        nl.position.set(Math.cos(ang)*r,h+5,Math.sin(ang)*r);
        envGroup.add(nl);
      }
    }
    // crowd silhouettes along track
    for(let i=0;i<Track.pts.length;i+=15){
      const p=Track.pts[i],wl=Track.wl[i],wr=Track.wr[i];
      for(let s=0;s<2;s++){
        const w=s===0?wl:wr;
        const dx=w.x-p.x,dz=w.z-p.z;
        const l=Math.sqrt(dx*dx+dz*dz)||1;
        const nx=dx/l,nz=dz/l;
        const crowd=new THREE.Mesh(new THREE.BoxGeometry(.5,1.8,.5),
          new THREE.MeshBasicMaterial({color:0x222244}));
        crowd.position.set(w.x+nx*2,.9,w.z+nz*2);
        envGroup.add(crowd);
      }
    }
  }
}

function addHarborExtras(){
  // rain particle system
  const geo=new THREE.BufferGeometry();
  const N=2000,pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){pos[i*3]=Math.random()*800-400;pos[i*3+1]=Math.random()*60;pos[i*3+2]=Math.random()*800-400;}
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const mat=new THREE.PointsMaterial({color:0x8899bb,size:.15,transparent:true,opacity:.5});
  scene.rainPts=new THREE.Points(geo,mat);
  scene.add(scene.rainPts);
  scene.rainPos=pos;
}
function addCanyonExtras(){}
function addNeonExtras(){
  // glowing track edge strips
  for(let i=0;i<Track.pts.length;i+=3){
    const wl=Track.wl[i],wr=Track.wr[i];
    [wl,wr].forEach(w=>{
      const m=new THREE.Mesh(new THREE.SphereGeometry(.15,4,4),
        new THREE.MeshBasicMaterial({color:0x7c3aed}));
      m.position.set(w.x,.05,w.z);scene.add(m);
    });
  }
}

// ── CAR MESH BUILDER ────────────────────────────────────────
function makeCarMeshRaw(carId,colorIdx,ghost){
  const group=new THREE.Group();
  const col=CAR_COLORS[colorIdx||0];
  const bodyMat=new THREE.MeshLambertMaterial({
    color:col[0],transparent:ghost,opacity:ghost?.35:1
  });
  const darkMat=new THREE.MeshLambertMaterial({color:col[1]});
  const glassMat=new THREE.MeshLambertMaterial({color:0x224466,transparent:true,opacity:.7});
  const wheelMat=new THREE.MeshLambertMaterial({color:0x222222});
  const rimMat=new THREE.MeshLambertMaterial({color:carId===3?0xc8a000:0x888888});

  // proportions per car
  const dims=[
    {bw:3.8,bh:.7,bl:7.2,rh:.55,rl:7.0,rw:4.2,ch:.65,cl:3.5,cw:3.4,co:.3},  // Civic
    {bw:3.6,bh:.65,bl:7.8,rh:.5,rl:7.6,rw:3.8,ch:.7,cl:3.8,cw:3.2,co:.15},  // 240
    {bw:4.2,bh:.7,bl:7.6,rh:.55,rl:7.4,rw:4.5,ch:.6,cl:3.6,cw:3.8,co:.15},  // Ghost
    {bw:3.8,bh:.65,bl:8.4,rh:.5,rl:8.2,rw:4.0,ch:.6,cl:3.4,cw:3.4,co:.2},   // Ryū
    {bw:4.0,bh:.5,bl:8.2,rh:.45,rl:8.0,rw:4.3,ch:.5,cl:3.2,cw:3.6,co:.1},   // Phantom
    {bw:4.4,bh:.45,bl:8.6,rh:.42,rl:8.4,rw:4.8,ch:.44,cl:3.4,cw:4.0,co:.0}, // VOID
  ][carId]||{bw:3.8,bh:.7,bl:7.2,rh:.55,rl:7.0,rw:4.2,ch:.65,cl:3.5,cw:3.4,co:.3};

  // body
  const body=new THREE.Mesh(new THREE.BoxGeometry(dims.bw,dims.bh,dims.bl),bodyMat);
  body.position.y=dims.rh+dims.bh/2-.1;body.castShadow=true;group.add(body);

  // roof cabin
  const roof=new THREE.Mesh(new THREE.BoxGeometry(dims.cw,dims.ch,dims.cl),darkMat);
  roof.position.set(0,dims.rh+dims.bh+dims.ch/2-.1,dims.co);
  roof.castShadow=true;group.add(roof);

  // windshield
  const wind=new THREE.Mesh(new THREE.BoxGeometry(dims.cw-.3,.01,dims.cl*.4),glassMat);
  wind.position.set(0,dims.rh+dims.bh+dims.ch/2-.1,dims.co+dims.cl*.3);
  wind.rotation.x=-.4;group.add(wind);

  // spoiler (cars 2+)
  if(carId>=2){
    const spMat=new THREE.MeshLambertMaterial({color:0x111111});
    const spwing=new THREE.Mesh(new THREE.BoxGeometry(dims.bw*1.1,.1,1.0),spMat);
    spwing.position.set(0,dims.rh+dims.bh+dims.ch*.8-.1,-dims.bl*.42);
    group.add(spwing);
    [-dims.bw*.5,dims.bw*.5].forEach(x=>{
      const spp=new THREE.Mesh(new THREE.BoxGeometry(.15,.7,.6),spMat);
      spp.position.set(x,dims.rh+dims.bh+dims.ch*.45-.1,-dims.bl*.42);group.add(spp);
    });
  }

  // VOID-R underglow
  if(carId===5){
    const glowMat=new THREE.MeshBasicMaterial({color:0xaa44ff,transparent:true,opacity:.8});
    const glow=new THREE.Mesh(new THREE.BoxGeometry(dims.bw+.4,.05,dims.bl+.4),glowMat);
    glow.position.y=.05;group.add(glow);
    group.userData.glowMesh=glow;
  }

  // wheels
  const wR=.38,wW=.3;
  const positions=[
    [dims.bw/2+wW/2,wR, dims.bl*.33],[-dims.bw/2-wW/2,wR, dims.bl*.33],
    [dims.bw/2+wW/2,wR,-dims.bl*.33],[-dims.bw/2-wW/2,wR,-dims.bl*.33]
  ];
  group.userData.wheels=[];
  positions.forEach((wp,wi)=>{
    const wg=new THREE.Group();
    const tyre=new THREE.Mesh(new THREE.CylinderGeometry(wR,wR,wW,16),wheelMat);
    tyre.rotation.z=Math.PI/2;
    const rim=new THREE.Mesh(new THREE.CylinderGeometry(wR*.6,wR*.6,wW+.02,8),rimMat);
    rim.rotation.z=Math.PI/2;
    wg.add(tyre,rim);
    wg.position.set(...wp);
    group.add(wg);
    group.userData.wheels.push(wg);
    if(wi<2)wg.userData.isFront=true;
  });

  return group;
}

function buildCarMesh(carId,colorIdx){
  if(carMesh)scene.remove(carMesh);
  carMesh=makeCarMeshRaw(carId,colorIdx,false);
  carMesh.castShadow=true;
  scene.add(carMesh);
}

// ── SMOKE PARTICLE ──────────────────────────────────────────
function spawnSmoke(x,y,z){
  const car=CARS[GS.selCar];
  const col=new THREE.Color(car.trail);
  for(let i=0;i<4;i++){
    const s=new THREE.Mesh(
      new THREE.SphereGeometry(.5+Math.random()*.6,4,4),
      new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.55,depthWrite:false})
    );
    s.position.set(x+(Math.random()-.5)*.8,y+.3+(Math.random()*.3),z+(Math.random()-.5)*.8);
    s.userData={
      vx:(Math.random()-.5)*.04,vy:.015+Math.random()*.02,vz:(Math.random()-.5)*.04,
      life:1.2,decay:.018+Math.random()*.01,sc:1
    };
    scene.add(s);smokeParts.push(s);
  }
}

function updateSmoke(dt){
  for(let i=smokeParts.length-1;i>=0;i--){
    const s=smokeParts[i];
    const u=s.userData;
    u.life-=u.decay*dt*60;
    s.material.opacity=u.life*.5;
    s.position.x+=u.vx;s.position.y+=u.vy;s.position.z+=u.vz;
    u.sc+=.008;s.scale.setScalar(u.sc);
    if(u.life<=0){scene.remove(s);smokeParts.splice(i,1);}
  }
}

// ── PHYSICS ─────────────────────────────────────────────────
function physTick(dt){
  if(!GS.running||GS.paused)return;
  const car=CARS[GS.selCar];
  const maxSp=car.topSpeed;

  if(GS.spinout){
    GS.spinTimer-=dt*1000;
    GS.speed*=Math.pow(.94,dt*60);
    GS.heading+=.1*dt*60*(GS.latVel>0?1:-1);
    GS.px+=Math.sin(GS.heading)*GS.speed*dt;
    GS.pz+=Math.cos(GS.heading)*GS.speed*dt;
    if(GS.spinTimer<=0){GS.spinout=false;GS.grip=.4;GS.latVel=0;GS.driftAngle=0;}
    return;
  }

  const steer=(K.right()?1:0)-(K.left()?1:0);
  GS.handbrake=K.hb();
  const speedRatio=Math.min(Math.abs(GS.speed)/maxSp,1);

  // handbrake — cut rear grip
  if(GS.handbrake){
    GS.grip=Math.max(.04,GS.grip-.10*dt*60);
  } else {
    const rg=car.driftK*.06*(GS.tireWear*.3+.7);
    GS.grip=Math.min(1,GS.grip+rg*dt*60);
  }

  // longitudinal
  if(K.fwd()){GS.speed=Math.min(GS.speed+car.accel*dt*60,maxSp);}
  else if(K.back()){GS.speed=Math.max(GS.speed-car.brake*dt*60,-maxSp*.3);}
  else{GS.speed*=Math.pow(.978,dt*60);}

  // steering
  const steerPow=car.steer*(1-speedRatio*.45);
  const latForce=steer*Math.abs(GS.speed)*steerPow*(1-GS.grip*.55);
  GS.latVel+=latForce*dt*60;
  GS.latVel*=Math.pow(1-GS.grip*car.gripR*8*dt,1);
  const maxLat=Math.abs(GS.speed)*.9;
  GS.latVel=Math.max(-maxLat,Math.min(maxLat,GS.latVel));

  // drift angle
  if(Math.abs(GS.speed)>2){
    GS.driftAngle=Math.atan2(GS.latVel,Math.abs(GS.speed))*180/Math.PI;
  } else GS.driftAngle*=.9;

  // spinout
  if(Math.abs(GS.driftAngle)>75&&Math.abs(GS.speed)>8){
    GS.spinout=true;GS.spinTimer=1500;
    Score.onSpinout();
    flashScreen('#ff000044');
    const sp=document.getElementById('h-spin');sp.style.display='block';
    setTimeout(()=>sp.style.display='none',1000);
  }

  // heading rotation
  GS.heading+=GS.latVel/Math.max(Math.abs(GS.speed),1)*dt*60*.18;

  // world position
  GS.px+=Math.sin(GS.heading)*GS.speed*dt;
  GS.pz+=Math.cos(GS.heading)*GS.speed*dt;

  // wall collision
  const wd=Track.wallDist(GS.px,GS.pz);
  const H2=Track.HALF;
  if(wd<H2-1.5){
    const ni=Track.nearest(GS.px,GS.pz);
    const tp=Track.pts[ni];
    const dx=GS.px-tp.x,dz=GS.pz-tp.z;
    const d=Math.sqrt(dx*dx+dz*dz)||1;
    const pd=H2-2;
    if(d>pd){
      GS.px=tp.x+dx/d*pd;GS.pz=tp.z+dz/d*pd;
      const impact=Math.abs(GS.speed)/maxSp;
      if(impact>.08){
        GS.shakeAmt=impact*8;Audio.hit(impact);
        GS.speed*=.35;GS.latVel*=.15;
        Score.breakCombo();
      }
    }
  }

  // tire wear
  if(GS.drifting)GS.tireWear=Math.max(0,GS.tireWear-.00004*dt*60);

  // near miss
  if(wd<H2-H2*.15&&wd>H2-H2*.3&&GS.drifting){
    Score.nearMiss();
  }

  // gear simulation
  const rpmRatio=Math.abs(GS.speed)/maxSp;
  GS.gear=Math.min(6,Math.max(1,Math.ceil(rpmRatio*6)));
  GS.rpm=rpmRatio;

  // spawn smoke
  if(GS.drifting&&GS.frame%2===0){
    const rearX=GS.px-Math.sin(GS.heading)*3.5;
    const rearZ=GS.pz-Math.cos(GS.heading)*3.5;
    spawnSmoke(rearX,.3,rearZ);
  }

  Audio.tick(Math.abs(GS.speed),maxSp,Math.abs(GS.driftAngle));

  // ghost record
  if(GS.frame%2===0)GS.ghRec.push({x:GS.px,z:GS.pz,h:GS.heading,s:GS.speed});
}

// ── SCORE ────────────────────────────────────────────────────
const Score={
  nmCd:0,
  tick(dt){
    if(!GS.running||GS.paused||GS.spinout)return;
    if(this.nmCd>0)this.nmCd-=dt*1000;
    const ang=Math.abs(GS.driftAngle),sp=Math.abs(GS.speed);
    if(ang>=15&&ang<75&&sp>4){
      if(!GS.drifting){
        GS.drifting=true;GS.driftScore=0;GS.driftDur=0;GS.driftCount++;
        const now=Date.now();
        if(now-GS.driftEndTime<1500){
          GS.combo++;
          if(GS.combo===5||GS.combo===10||GS.combo===20)Audio.combo(GS.combo);
          this.updCombo();
        } else {GS.combo=1;this.updCombo();}
      }
      GS.driftDur+=dt;
      let tm=GS.driftDur>10?3:GS.driftDur>6?2:GS.driftDur>3?1.5:1;
      const cm=1+(GS.combo-1)*.12;
      GS.driftMult=tm*cm;
      GS.driftScore+=ang*(sp*.2)*.04*GS.driftMult*dt*60;
      // show live drift score
      const dd=document.getElementById('h-drift');
      dd.style.display='block';
      dd.textContent=Math.floor(GS.driftScore).toLocaleString()+' ×'+GS.driftMult.toFixed(1);
    } else if(GS.drifting){
      GS.drifting=false;GS.driftEndTime=Date.now();
      const dd=document.getElementById('h-drift');dd.style.display='none';
      if(GS.driftScore>1){
        const pts=Math.floor(GS.driftScore);
        GS.score+=pts;
        if(pts>GS.bestDrift)GS.bestDrift=pts;
        GS.coinProg+=pts;
        const earned=Math.floor(GS.coinProg/100);
        if(earned>0){GS.coinProg-=earned*100;GS.coinsEarned+=earned;Audio.coin();}
        UI.updHUD();
        // floating score in DOM
        showFloat('+'+pts.toLocaleString());
      }
      GS.driftScore=0;GS.driftDur=0;
    } else {
      if(GS.combo>0&&Date.now()-GS.driftEndTime>1500)this.breakCombo();
    }
  },
  nearMiss(){
    if(this.nmCd>0)return;this.nmCd=600;
    if(GS.drifting){GS.driftMult+=.5;GS.nearMisses++;
      const nm=document.getElementById('h-near');nm.style.display='block';
      setTimeout(()=>nm.style.display='none',700);}
  },
  onSpinout(){
    this.breakCombo();GS.drifting=false;GS.driftScore=0;
    GS.score=Math.max(0,GS.score-50);UI.updHUD();
  },
  breakCombo(){
    if(GS.combo>1)flashCombo();
    GS.combo=0;
    const el=document.getElementById('h-combo');el.style.display='none';
  },
  updCombo(){
    const el=document.getElementById('h-combo');
    if(GS.combo>1){
      el.textContent=GS.combo+'x';el.style.display='block';
      el.style.transform='translateY(-50%) scale(1.4)';
      setTimeout(()=>el.style.transform='translateY(-50%) scale(1)',150);
      if(GS.combo>GS.bestCombo)GS.bestCombo=GS.combo;
    }
  }
};

// ── RIVAL AI ─────────────────────────────────────────────────
const Rival={
  x:0,z:0,h:0,speed:0,idx:5,
  init(){
    if(!GS.unlocked.includes(2)){if(rivalMesh)rivalMesh.visible=false;return;}
    const sp=Track.startPos();
    this.x=sp.x+3;this.z=sp.z+3;this.h=sp.heading;this.idx=5;
    this.speed=12+Math.min(GS.coins/2000,8);
    if(rivalMesh)rivalMesh.visible=true;
  },
  tick(dt){
    if(!rivalMesh||!rivalMesh.visible)return;
    this.idx=(this.idx+2)%Track.pts.length;
    const tp=Track.pts[this.idx];
    const dx=tp.x-this.x,dz=tp.z-this.z;
    const ta=Math.atan2(dx,dz);
    let da=ta-this.h;
    while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;
    this.h+=da*.1;
    this.x+=Math.sin(this.h)*this.speed*dt;
    this.z+=Math.cos(this.h)*this.speed*dt;
    rivalMesh.position.set(this.x,.38,this.z);
    rivalMesh.rotation.y=-this.h;
    // tandem bonus
    const dist=Math.sqrt((this.x-GS.px)**2+(this.z-GS.pz)**2);
    if(dist<10&&GS.drifting&&Math.random()<.005)showFloat('TANDEM! +1x');
  }
};

// ── CAMERA ──────────────────────────────────────────────────
function updateCamera(){
  const shX=GS.shakeAmt>0?(Math.random()-.5)*GS.shakeAmt*.4:0;
  const shY=GS.shakeAmt>0?(Math.random()-.5)*GS.shakeAmt*.2:0;
  if(GS.shakeAmt>0)GS.shakeAmt*=.85;
  const d=GS.camDist,h=GS.camHeight;
  const spRatio=Math.abs(GS.speed)/CARS[GS.selCar].topSpeed;
  const fov=60+spRatio*14;
  if(Math.abs(camera.fov-fov)>.1){camera.fov+=(fov-camera.fov)*.08;camera.updateProjectionMatrix();}
  // chase cam behind car
  const targetX=GS.px-Math.sin(GS.heading)*d;
  const targetZ=GS.pz-Math.cos(GS.heading)*d;
  camera.position.x+=(targetX-camera.position.x)*.12;
  camera.position.y+=(h-camera.position.y)*.12;
  camera.position.z+=(targetZ-camera.position.z)*.12;
  camera.position.x+=shX;camera.position.y+=shY;
  // look at car slightly ahead
  camera.lookAt(GS.px+Math.sin(GS.heading)*2,0,GS.pz+Math.cos(GS.heading)*2);
}

function drawSpeedo(){
  const cv=document.getElementById('speedo'),ctx=cv.getContext('2d');
  const W=cv.width,H=cv.height,cx=W/2,cy=H/2,r=50;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='rgba(0,0,0,.72)';ctx.beginPath();ctx.arc(cx,cy,r+8,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.1)';ctx.lineWidth=8;
  ctx.beginPath();ctx.arc(cx,cy,r,Math.PI*.75,Math.PI*2.25);ctx.stroke();
  const ratio=Math.min(Math.abs(GS.speed)/CARS[GS.selCar].topSpeed,1);
  const g=ctx.createLinearGradient(0,cy,W,cy);
  g.addColorStop(0,'#00cfff');g.addColorStop(1,ratio>.8?'#ff4444':'#00ff88');
  ctx.strokeStyle=g;ctx.lineWidth=8;
  ctx.beginPath();ctx.arc(cx,cy,r,Math.PI*.75,Math.PI*.75+ratio*Math.PI*1.5);ctx.stroke();
  const na=Math.PI*.75+ratio*Math.PI*1.5;
  ctx.strokeStyle='#fff';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(na)*r*.82,cy+Math.sin(na)*r*.82);ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx,cy,4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 15px Rajdhani';ctx.textAlign='center';
  ctx.fillText(Math.floor(Math.abs(GS.speed)*10)+'',cx,cy+18);
  ctx.fillStyle='rgba(255,255,255,.4)';ctx.font='9px Inter';ctx.fillText('km/h',cx,cy+29);
}
function drawDriftArc(){
  const cv=document.getElementById('driftarc'),ctx=cv.getContext('2d');
  const W=cv.width,H=cv.height,cx=W/2,cy=H/2+4,r=32;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='rgba(0,0,0,.7)';ctx.beginPath();ctx.arc(cx,cy,r+8,0,Math.PI*2);ctx.fill();
  const ratio=Math.min(Math.abs(GS.driftAngle)/75,1);
  ctx.strokeStyle='rgba(255,255,255,.1)';ctx.lineWidth=6;
  ctx.beginPath();ctx.arc(cx,cy,r,Math.PI,0);ctx.stroke();
  const col=ratio>.8?'#ff4444':ratio>.5?'#ffaa00':'#00cfff';
  ctx.strokeStyle=col;ctx.lineWidth=6;
  ctx.beginPath();ctx.arc(cx,cy,r,Math.PI,Math.PI+ratio*Math.PI);ctx.stroke();
  ctx.fillStyle=col;ctx.font='bold 11px Rajdhani';ctx.textAlign='center';
  ctx.fillText(Math.floor(Math.abs(GS.driftAngle))+'°',cx,cy+4);
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.font='8px Inter';ctx.fillText('DRIFT',cx,cy-16);
}
function drawMinimap(){
  const cv=document.getElementById('mmap'),ctx=cv.getContext('2d');
  const W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
  if(!Track.pts.length)return;
  let mx=Infinity,Mx=-Infinity,mz=Infinity,Mz=-Infinity;
  for(const p of Track.pts){if(p.x<mx)mx=p.x;if(p.x>Mx)Mx=p.x;if(p.z<mz)mz=p.z;if(p.z>Mz)Mz=p.z;}
  const mg=10,sc=Math.min((W-mg*2)/(Mx-mx),(H-mg*2)/(Mz-mz));
  const tx=x=>(x-mx)*sc+mg+(W-mg*2-(Mx-mx)*sc)/2;
  const tz=z=>(z-mz)*sc+mg+(H-mg*2-(Mz-mz)*sc)/2;
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;ctx.beginPath();
  Track.pts.forEach((p,i)=>{i===0?ctx.moveTo(tx(p.x),tz(p.z)):ctx.lineTo(tx(p.x),tz(p.z));});
  ctx.closePath();ctx.stroke();
  ctx.fillStyle='#00cfff';ctx.beginPath();ctx.arc(tx(GS.px),tz(GS.pz),4,0,Math.PI*2);ctx.fill();
  if(ghostMesh&&ghostMesh.visible){
    ctx.fillStyle='rgba(255,255,255,.4)';ctx.beginPath();ctx.arc(tx(ghostMesh.position.x),tz(ghostMesh.position.z),3,0,Math.PI*2);ctx.fill();
  }
  if(rivalMesh&&rivalMesh.visible){
    ctx.fillStyle='#ff4444';ctx.beginPath();ctx.arc(tx(rivalMesh.position.x),tz(rivalMesh.position.z),3,0,Math.PI*2);ctx.fill();
  }
}

// ── CAR 3D UPDATE ────────────────────────────────────────────
function updateCarMesh(){
  if(!carMesh)return;
  carMesh.position.set(GS.px,.38,GS.pz);
  carMesh.rotation.y=-GS.heading;
  // body lean into drift
  const lean=GS.driftAngle*(.012);
  carMesh.rotation.z=-lean;
  // wheel spin
  const ws=carMesh.userData.wheels||[];
  ws.forEach((w,i)=>{
    w.rotation.x+=GS.speed*.04;
    if(w.userData.isFront){
      const steer=(K.right()?1:0)-(K.left()?1:0);
      w.rotation.y=steer*.35*(1-Math.min(Math.abs(GS.speed)/CARS[GS.selCar].topSpeed,.8)*.6);
    }
  });
  // VOID-R pulsing underglow
  if(carMesh.userData.glowMesh){
    const t=Date.now()/600;
    carMesh.userData.glowMesh.material.opacity=.6+Math.sin(t)*.3;
  }
}

// rain update
function updateRain(){
  if(GS.selMap!==0||!scene.rainPts)return;
  const pos=scene.rainPos,N=pos.length/3;
  const speed=.4+GS.weatherT*.6;
  for(let i=0;i<N;i++){
    pos[i*3+1]-=speed;
    if(pos[i*3+1]<0)pos[i*3+1]=60;
    pos[i*3]+=.08;
  }
  scene.rainPts.geometry.attributes.position.needsUpdate=true;
}

function showGCar(id){

    <div class="statbg"><div class="statfill" style="width:${Math.min(100,s.v*100).toFixed(0)}%"></div></div></div>`).join('');
  // color
  const cp=document.getElementById('g-cpick');cp.innerHTML='';
  if(owned)CAR_COLORS.forEach((c,i)=>{const sw=document.createElement('div');sw.className='csw'+(i===(GS.colors[id]||0)?' on':'');sw.style.background=c[0];sw.onclick=()=>{GS.colors[id]=i;document.querySelectorAll('.csw').forEach((s,j)=>s.classList.toggle('on',j===i));Save.save();buildCarGrid();animGCar(id);};cp.appendChild(sw);});
  // buttons
  const sb=document.getElementById('g-selbtn'),bb=document.getElementById('g-buybtn');
  if(owned){sb.style.display='block';sb.textContent=id===GS.selCar?'SELECTED':'SELECT';bb.style.display='none';}
  else{sb.style.display='none';bb.style.display='block';bb.textContent='BUY 🪙'+def.price.toLocaleString();bb.disabled=GS.coins<def.price;bb.style.opacity=GS.coins<def.price?'.4':'1';}
  animGCar(id);
}
function animGCar(id){
  if(gCarAnim)cancelAnimationFrame(gCarAnim);
  const cv=document.getElementById('g-canvas'),ctx=cv.getContext('2d');
  const W=cv.width,H=cv.height;
  let t=0;
  const loop=()=>{
    if(!document.getElementById('s-garage').classList.contains('active'))return;
    t+=16;ctx.clearRect(0,0,W,H);
    // bg
    const bg=ctx.createRadialGradient(W/2,H*0.6,0,W/2,H*0.6,H*.8);
    bg.addColorStop(0,'rgba(255,255,255,.08)');bg.addColorStop(1,'transparent');
    ctx.fillStyle='#060610';ctx.fillRect(0,0,W,H);ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    // shadow
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.beginPath();ctx.ellipse(W/2,H*.8,60,8,0,0,Math.PI*2);ctx.fill();
    // car top-down isometric
    const bob=Math.sin(t/700)*3;
    drawGarageCar3D(ctx,id,GS.colors[id]||0,W/2,H/2+bob);
    gCarAnim=requestAnimationFrame(loop);
  };loop();
}
function drawGarageCar3D(ctx,id,ci,cx,cy){
  const c=CAR_COLORS[ci||0];
  const def=CARS[id];
  const owned=GS.unlocked.includes(id);
  if(!owned){ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(cx-60,cy-30,120,60);ctx.fillStyle='rgba(255,255,255,.3)';ctx.font='36px Inter';ctx.textAlign='center';ctx.fillText('🔒',cx,cy+12);return;}
  // isometric projection
  const scale=3.2;
  const bw=def.topSpeed*.08+2.2,bl=def.topSpeed*.12+3.8,bh=.6;
  // shadow
  // body (side view rotated)
  ctx.save();ctx.translate(cx,cy);
  // draw car top-down with slight angle
  // body
  ctx.fillStyle=c[0];
  ctx.beginPath();
  ctx.moveTo(-bl*scale*.5,bw*scale*.25);
  ctx.lineTo(-bl*scale*.5,-bw*scale*.25);
  ctx.lineTo(bl*scale*.5,-bw*scale*.28);
  ctx.lineTo(bl*scale*.5,bw*scale*.28);
  ctx.closePath();ctx.fill();
  // roof
  ctx.fillStyle=c[1];
  ctx.fillRect(-bl*scale*.2,-bw*scale*.2,bl*scale*.5,bw*scale*.4);
  // windshield
  ctx.fillStyle='rgba(100,160,210,.7)';
  ctx.fillRect(-bl*scale*.02,-bw*scale*.18,bl*scale*.22,bw*scale*.36);
  // rear window
  ctx.fillRect(-bl*scale*.28,-bw*scale*.15,bl*scale*.12,bw*scale*.3);
  // wheels
  ctx.fillStyle='#1a1a1a';
  [[-bl*scale*.35,-bw*scale*.32],[bl*scale*.28,-bw*scale*.32],
   [-bl*scale*.35,bw*scale*.32],[bl*scale*.28,bw*scale*.32]].forEach(([wx,wy])=>{
    ctx.beginPath();ctx.ellipse(wx,wy,bw*scale*.12,bw*scale*.07,0,0,Math.PI*2);ctx.fill();
  });
  // id-specific details
  if(id>=2){// spoiler
    ctx.fillStyle='#111';ctx.fillRect(-bl*scale*.5,-bw*scale*.34,bl*scale*.06,bw*scale*.68);}
  if(id===5){// glow
    ctx.shadowColor='#aa44ff';ctx.shadowBlur=16;
    ctx.strokeStyle='rgba(170,68,255,.8)';ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(-bl*scale*.5,bw*scale*.28);ctx.lineTo(-bl*scale*.5,-bw*scale*.28);
    ctx.lineTo(bl*scale*.5,-bw*scale*.28);ctx.lineTo(bl*scale*.5,bw*scale*.28);ctx.closePath();ctx.stroke();
    ctx.shadowBlur=0;}
  ctx.restore();
}

// ── UI ───────────────────────────────────────────────────────
const UI={
  goMenu(){
    GS.running=false;GS.paused=false;
    this.set('menu');document.getElementById('hud').classList.remove('on');
    document.getElementById('menu-coins').textContent=GS.coins.toLocaleString();
  },
  goMap(){buildMapCards();this.set('map');},
  goGarage(){buildGarage();this.set('garage');},
  goRecords(){
    this.set('records');
    for(let i=0;i<3;i++){
      document.getElementById('r'+i+'s').textContent=(GS.best[i].s||0).toLocaleString();
      document.getElementById('r'+i+'d').textContent=(GS.best[i].d||0).toLocaleString();
      document.getElementById('r'+i+'c').textContent=(GS.best[i].c||0)+'x';
    }
  },
  startGame(){
    this.set(null);document.getElementById('hud').classList.add('on');
    resetSession();
    Track.gen(GS.selMap);
    buildScene(GS.selMap);
    const sp=Track.startPos();
    GS.px=sp.x;GS.pz=sp.z;GS.heading=sp.heading;
    GS.vx=0;GS.vz=0;GS.speed=0;GS.latVel=0;GS.grip=1;GS.spinout=false;GS.tireWear=1;GS.driftAngle=0;
    camera.position.set(GS.px,6,GS.pz-14);
    GS.camDist=12;GS.camHeight=5;GS.shakeAmt=0;
    GS.running=true;GS.paused=false;GS.t=0;GS.frame=0;GS.weatherT=0;
    Ghost.start();Rival.init();
    document.getElementById('h-map').textContent=MAPS[GS.selMap].name;
    if(Audio.ctx&&Audio.ctx.state==='suspended')Audio.ctx.resume();
    this.updHUD();
  },
  pause(){GS.paused=true;this.set('pause');},
  resume(){GS.paused=false;this.set(null);},
  endSession(){
    GS.running=false;GS.paused=false;
    document.getElementById('hud').classList.remove('on');
    const mi=GS.selMap;
    const nb=GS.score>GS.best[mi].s;
    if(nb)GS.best[mi].s=GS.score;
    if(GS.bestDrift>GS.best[mi].d)GS.best[mi].d=GS.bestDrift;
    if(GS.bestCombo>GS.best[mi].c)GS.best[mi].c=GS.bestCombo;
    GS.coins+=GS.coinsEarned;
    Ghost.save();Save.save();
    document.getElementById('e-best').style.display=nb?'block':'none';
    const st=[['TOTAL SCORE',GS.score.toLocaleString()],['BEST DRIFT',GS.bestDrift.toLocaleString()],['BEST COMBO',GS.bestCombo+'x'],['DRIFTS',GS.driftCount],['NEAR MISSES',GS.nearMisses]];
    document.getElementById('e-grid').innerHTML=st.map(([l,v])=>`<div style="color:rgba(255,255,255,.6)">${l}</div><div class="ev">${v}</div>`).join('');
    document.getElementById('e-coins').textContent=GS.coinsEarned;
    const ss=GS.score+GS.bestCombo*50+GS.nearMisses*20;
    let rtg=RATINGS[0];for(const r of RATINGS)if(ss>=r.min)rtg=r;
    const re=document.getElementById('e-rtg');re.textContent=rtg.g;
    re.style.color=rtg.g==='LEGEND'?'#ffd700':rtg.g.startsWith('S')?'#00cfff':rtg.g==='A'?'#00ff88':'#fff';
    document.getElementById('e-flv').textContent=rtg.t;
    this.set('end');
  },
  tryAgain(){this.startGame();},
  selCar(){GS.selCar=gViewId;showGCar(gViewId);buildCarGrid();Save.save();buildCarMesh(GS.selCar,GS.colors[GS.selCar]||0);showFloat('Car selected!');},
  buyCar(){
    const def=CARS[gViewId];
    if(GS.coins<def.price){showFloat('Not enough coins!');return;}
    GS.coins-=def.price;GS.unlocked.push(def.id);Save.save();
    Audio.unlock();showGCar(def.id);buildCarGrid();
    document.getElementById('g-coins').textContent=GS.coins.toLocaleString();
    showFloat('🎉 '+def.name+' unlocked!');
  },
  updHUD(){
    document.getElementById('h-score').textContent=GS.score.toLocaleString();
    document.getElementById('h-bestv').textContent=GS.bestDrift.toLocaleString();
    document.getElementById('h-ccnt').textContent=GS.coinsEarned;
    document.getElementById('h-cpfill').style.width=(GS.coinProg)+'%';
    document.getElementById('h-gear').textContent=GS.gear;
  },
  set(name){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    if(name)document.getElementById('s-'+name)?.classList.add('active');
  }
};

function resetSession(){
  GS.score=0;GS.bestDrift=0;GS.bestCombo=0;GS.driftCount=0;
  GS.nearMisses=0;GS.coinsEarned=0;GS.coinProg=0;
  GS.drifting=false;GS.driftScore=0;GS.driftDur=0;GS.combo=0;
  GS.driftEndTime=0;GS.ghRec=[];
  document.getElementById('h-combo').style.display='none';
  document.getElementById('h-drift').style.display='none';
  document.getElementById('h-spin').style.display='none';
}

// ── MAIN LOOP ────────────────────────────────────────────────
let last=0;
function loop(ts){
  const dt=Math.min((ts-last)/1000,.05);last=ts;
  GS.t+=dt;GS.frame++;

  if(GS.running&&!GS.paused){
    physTick(dt);
    Score.tick(dt);
    updateSmoke(dt);
    updateCarMesh();
    if(GS.selMap===0){GS.weatherT=Math.min(1,GS.t/90);updateRain();}
    Ghost.tick();
    Rival.tick(dt);
    updateCamera();
    drawSpeedo();drawDriftArc();drawMinimap();
    UI.updHUD();
  }

  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}

// ── INIT ─────────────────────────────────────────────────────
Save.load();
initThree();

// build empty scene for menu bg
scene=new THREE.Scene();
scene.background=new THREE.Color(0x040810);
camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,3000);
camera.position.set(0,8,-18);camera.lookAt(0,0,0);

// dummy spinning car for menu
(function(){
  const g=new THREE.Group();
  const b=new THREE.Mesh(new THREE.BoxGeometry(3.8,.7,7.2),new THREE.MeshLambertMaterial({color:0x1a6bb5}));
  b.position.y=.75;g.add(b);
  const r=new THREE.Mesh(new THREE.BoxGeometry(3.2,.65,3.4),new THREE.MeshLambertMaterial({color:0x0d4a80}));
  r.position.set(0,1.45,.15);g.add(r);
  const al=new THREE.AmbientLight(0x102030,.8);
  const dl=new THREE.DirectionalLight(0x3060a0,1.4);dl.position.set(10,15,5);
  scene.add(g,al,dl);
  scene.userData.menuCar=g;
  // grid floor
  const grid=new THREE.GridHelper(100,30,0x112244,0x0a1530);
  scene.add(grid);
  // animate
  function menuAnim(){
    if(GS.running)return;
    const m=scene.userData.menuCar;
    if(m)m.rotation.y+=.008;
    renderer.render(scene,camera);
    requestAnimationFrame(menuAnim);
  }
  menuAnim();
})();

Audio.init();
requestAnimationFrame(loop);
</script>
